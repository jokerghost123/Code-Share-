<title>Code-Share — Créer un compte</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet" />

<style>
:root {
--gold: #F5A800;
--blue: #1A6FE8;
--black: #0A0A0A;
--card: #16191F;
--white: #FFFFFF;
--gray: #8892A4;
--error: #ff4d4d;
--success: #28C840;
}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
background: var(--black);
color:var(--white);
font-family: sans-serif;
min-height: 100vh;
display: flex;
flex-direction: column;
}

body::before {
content: '';
position: fixed;
inset: 0;
background-size: 60px 60px;
pointer-events: none;
z-index: 0;
}

nav {
position: relative;
z-index: 10;
display: flex;
align-items: center;
justify-content: space-between;
padding: 18px 60px;
border-bottom: 1px solid rgba(245,168,0,0.15);
background: rgba(10,10,10,0.9);
}

.nav-logo {
display: flex;
align-items: center;
gap: 12px;
text-decoration: none;
}

.nav-logo img {
width: 40px;
height: 40px;
object-fit: contain;
border-radius: 50px;
}
.logo-text {
font-family: 'Orbitron', monospace;
font-size: 1.rem;
font-weight: 700;
color: var(--white);
}

.logo-text .bracket {
color: var(--blue);
}
.logo-text .code {
color: var(--gold);
}
.nav-login {
font-size: 0.9rem;
color: var(--gray);
}
.nav-login a {
color: var(--gold);
text-decoration: none;
font-weight: 600;
margin-left: 0px;
}

main {
position: relative;
z-index: 1;
flex: 1;
display: flex;
align-items: center;
justify-content: center;
padding: 40px 20px;
}

.signup-container {
width: 100%;
max-width: 520px;
}

.signup-header {
text-align: center;
margin-bottom: 32px;
}

.signup-header h1 {
font-family: 'Orbitron', monospace;
font-size: 1.6rem;
font-weight: 900;
margin-bottom: 8px;
}

.signup-header h1 span {
color: var(--gold);
}
.signup-header p {
color:var(--white);
font-size: 0.95rem;
}
.role-selector {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 12px;
margin-bottom: 28px;
}
.role-card {
background: var(--black);
border:none;
border-radius: 10px;
padding: 16px;
cursor: none;
transition: all 0.2s;
text-align: center;
}

.role-card.selected {
border-color: var(--blue);
background: rgba(245,168,0,0.08);
}
.role-icon {
font-size: 1.8rem;
margin-bottom: 8px;
}
.role-title {
font-family: 'Orbitron', monospace;
font-size: 0.82rem;
font-weight: 700;
margin-bottom: 4px;
}
.role-card.selected .role-title {
color: var(--gold);
}
.role-desc {
font-size: 0.75rem;
color:var(--white);
line-height: 1.4;
}
.form-card {
background: var(--black);
border:none;
border-radius: 16px;
padding: 36px;
}
.form-row {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 16px;
}
.form-group {
margin-bottom: 20px;
}
.form-group label {
display: block;
font-size: 0.82rem;
font-weight: 600;
color:var(--white);
margin-bottom: 8px;
}
.form-group label span {
color: var(--gold);
}
.input-wrapper {
position: relative;
}
.input-icon {
position: absolute;
left: 14px;
top: 50%;
transform: translateY(-50%);
font-size: 1rem;
pointer-events: none;
}
.form-group input {
width: 100%;
background: rgba(255,255,255,0.05);
border: 1.5px solid rgba(255,255,255,0.1);
border-radius: 8px;
padding: 12px 14px 12px 42px;
color:var(--white);
font-family:sans-serif;
font-size: 0.92rem;
transition: border-color 0.2s;
outline: none;
}
.form-group input:focus {
border-color: var(--gold);
box-shadow: 0 0 0 3px rgba(245,168,0,0.12);
}
.form-group input::placeholder {
color: rgba(255,255,255,0.2);
}
.error-msg {
color: var(--error);
font-size: 0.75rem;
margin-top: 5px;
display: none;
}
.password-strength {
margin-top: 8px;
display: none;
}
.strength-bar {
height: 4px;
background: rgba(255,255,255,0.1);
border-radius: 2px;
overflow: hidden;
margin-bottom: 4px;
}
.strength-fill {
height: 100%;
width: 0%;
border-radius: 2px;
transition: all 0.3s;
}
.strength-label {
font-size: 0.72rem;
color: var(--white);
}
.languages-grid {
display: flex;
flex-wrap: wrap;
gap: 8px;
margin-top: 4px;
}
.lang-tag {
background: rgba(255,255,255,0.05);
border: 1.5px solid rgba(255,255,255,0.1);
border-radius: 6px;
padding: 5px 12px;
font-size: 0.78rem;
cursor: none;
transition: all 0.2s;
color:var(--white);
}
.lang-tag.selected {
border-color: var(--blue);
background: rgba(26,111,232,0.15);
color: var(--blue);
font-weight: 600;
}
.checkbox-group {
display: flex;
align-items: flex-start;
gap: 10px;
margin-bottom: 24px;
}
.checkbox-group input[type="checkbox"] {
width: 18px;
height: 18px;
accent-color: var(--gold);
flex-shrink: 0;
margin-top: 2px;
padding: 0;
}
.checkbox-group label {
font-size: 0.82rem;
color: var(--gray);
cursor: none;
line-height: 1.5;
}
.checkbox-group label a {
color: var(--gold);
text-decoration: none;
}
.btn-submit {
width: 100%;
padding: 14px;
background:var(--blue);
color:var(--white);
border: none;
border-radius: 8px;
font-family: 'Orbitron', monospace;
font-weight: 700;
font-size: 0.95rem;
cursor:none;
transition: all 0.25s;
}
.btn-submit:hover {
transform: translateY(-2px);
box-shadow: 0 10px 28px rgba(245,168,0,0.35);
}
.btn-submit:disabled {
opacity: 0.6;
cursor: not-allowed;
transform: none;
}
.alert {
display: none;
padding: 12px 16px;
border-radius: 8px;
font-size: 0.85rem;
margin-bottom: 20px;
border: 1px solid;
}
.alert.error {
background: rgba(255,77,77,0.1);
border-color: rgba(255,77,77,0.3);
color: var(--error);
}
.alert.success {
background: rgba(40,200,64,0.1);
border-color: rgba(40,200,64,0.3);
color: var(--success);
}
.divider {
display: flex;
align-items: center;
gap: 12px;
margin: 20px 0;
}
.divider::before, .divider::after {
content: '';
flex: 1;
height: 1px;
background: rgba(255,255,255,0.08);
}
.divider span {
font-size: 0.78rem;
color:var(--white);
}
.already-account {
text-align: center;
font-size: 0.88rem;
color:var(--white);
margin-top: 20px;
}
.already-account a {
color: var(--gold);
text-decoration: none;
font-weight: 600;
}
@media (max-width: 600px) {
nav {
padding: 14px 20px;
}

.form-card {
padding: 24px 20px;
}

.form-row {
grid-template-columns: 1fr;
gap: 0;
}
}
</style>

const auth = getAuth(app);
const db = getFirestore(app);

window.handleSignup = async function() {
const firstName = document.getElementById('firstName').value.trim();
const lastName = document.getElementById('lastName').value.trim();
const username = document.getElementById('username').value.trim();
const email = document.getElementById('email').value.trim();
const password = document.getElementById('password').value;
const terms = document.getElementById('terms').checked;
const alertBox = document.getElementById('alertBox');
const btn = document.getElementById('submitBtn');

if (!firstName || !lastName || !username || !email || !password) {
showAlert('error', 'Veuillez remplir tous les champs obligatoires.');
return;
}
if (password.length < 8) {
showAlert('error', 'Le mot de passe doit contenir au moins 8 caractères.');
return;
}
if (!terms) {
showAlert('error', ' Veuillez accepter les conditions d\'utilisation.');
return;
}


const langs = [...document.querySelectorAll('.lang-tag.selected')].map(t => t.textContent);

btn.disabled = true;
btn.textContent = 'Création en cours...';

try {

const userCredential = await createUserWithEmailAndPassword(auth, email, password);
const user = userCredential.user;


await updateProfile(user, {
displayName: firstName + ' ' + lastName
});


await setDoc(doc(db, 'users', user.uid), {
firstName,
lastName,
username,
role: window.selectedRole || 'apprenant',
languages: langs,
createdAt: new Date().toISOString(),
points: 0,
tutorials: 0,
answers: 0
});

showAlert('success', ' Compte créé avec succès ! Redirection...');
setTimeout(() => {
window.location.href = 'index.html';
}, 2000);

} catch (err) {
btn.disabled = false;
btn.textContent = 'CRÉER MON COMPTE →';
if (err.code === 'auth/email-already-in-use') {
showAlert('error', ' Cet email est déjà utilisé.');
} else if (err.code === 'auth/weak-password') {
showAlert('error', 'Mot de passe trop faible.');
} else {
showAlert('error', ' Erreur : ' + err.message);
}
}
};

function showAlert(type, msg) {
const box = document.getElementById('alertBox');
box.className = 'alert ' + type;
box.textContent = msg;
box.style.display = 'block';
}
</script>

<script>
let selectedRole = 'apprenant';
function selectRole(el, role) {
document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
el.classList.add('selected');
window.selectedRole = role;
}
function toggleLang(el) {
el.classList.toggle('selected');
}
function checkStrength(val) {
const bar = document.getElementById('strengthBar');
const fill = document.getElementById('strengthFill');
const label = document.getElementById('strengthLabel');
bar.style.display = 'block';
let score = 0;
if (val.length >= 8) score++;
if (/[A-Z]/.test(val)) score++;
if (/[0-9]/.test(val)) score++;
if (/[^A-Za-z0-9]/.test(val)) score++;
const levels = [{
w: '25%',
color: '#ff4d4d',
text: 'Très faible'
},
{
w: '50%',
color: '#F5A800',
text: 'Faible'
},
{
w: '75%',
color: '#1A6FE8',
text: 'Bon'
},
{
w: '100%',
color: '#28C840',
text: 'Fort'
},
];
const lvl = levels[score - 1] || levels[0];
fill.style.width = lvl.w;
fill.style.background = lvl.color;
label.textContent = lvl.text;
label.style.color = lvl.color;
}
</script>
