<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Code-Share — Recherche</ttitle 
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet" />

<style>
:root {
--gold: #F5A800;
--blue: #1A6FE8;
--black: #0A0A0A;
--card: #16191F;
--white: #FFFFFF;
--gray: #8892A4;
}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
background: var(--black);
color:#E2E5E7;
font-family:sans-serif;
min-height: 100vh;
}
body::before {
content: "";
position: fixed;
inset: 0;
background-image: linear-gradient(rgba(245,168,0,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(245,168,0,0.03) 1px,transparent 1px);
background-size: 60px 60px;
pointer-events: none;
z-index: 0;
}

nav {
position: sticky;
top: 0;
z-index: 100;
display: flex;
align-items: center;
justify-content: space-between;
padding: 14px 20px;
background: rgba(10,10,10,0.95);
backdrop-filter: blur(12px);
border-bottom: 1px solid rgba(245,168,0,0.15);
}
.nav-logo {
display: flex;
align-items: center;
gap: 10px;
cursor: pointer;
}
.nav-logo img {
width: 34px;
height: 34px;
object-fit: contain;
border-radius: 50%;
}
.logo-text {
font-family: "Orbitron",monospace;
font-size: 0.9rem;
font-weight: 700;
color: var(--white);
}
.logo-text .b {
color: var(--blue);
}

.logo-text .g {
color: var(--gold);
}
.nav-links {
display: flex;
gap: 20px;
}
.nav-links a {
color: var(--gray);
text-decoration: none;
font-size: 0.82rem;
font-weight: 600;
cursor: pointer;
transition: color 0.2s;
}
.nav-links a:hover, .nav-links a.active {
color: var(--gold);
}
.nav-right {
display: flex;
align-items: center;
gap: 10px;
}
.nav-avatar {
width: 34px;
height: 34px;
border-radius: 50%;
background: linear-gradient(135deg,var(--gold),var(--blue));
display: flex;
align-items: center;
justify-content: center;
font-weight: 700;
font-size: 0.8rem;
cursor: pointer;
border: 2px solid rgba(245,168,0,0.4);
overflow: hidden;
}
.nav-avatar img {
width: 100%;
height: 100%;
object-fit: cover;
border-radius: 50%;
}

.search-hero {
position: relative;
z-index: 1;
padding: 40px 20px 30px;
text-align: center;
background: linear-gradient(180deg,rgba(245,168,0,0.05) 0%,transparent 100%);
border-bottom: 1px solid rgba(255,255,255,0.06);
}
.search-hero h1 {
font-family: "Orbitron",monospace;
font-size: 1.6rem;
font-weight: 900;
margin-bottom: 8px;
}
.search-hero h1 span {
color: var(--gold);
}
.search-hero p {
color: var(--gray);
font-size: 0.88rem;
margin-bottom: 24px;
}
.big-search {
display: flex;
gap: 10px;
max-width: 620px;
margin: 0 auto;
}
.big-search-wrap {
flex: 1;
position: relative;
}
.big-search-wrap span {
position: absolute;
left: 14px;
top: 50%;
transform: translateY(-50%);
font-size: 1.1rem;
}
.big-search-wrap input {
width: 100%;
background: var(--card);
border: 2px solid rgba(255,255,255,0.1);
border-radius: 10px;
padding: 14px 14px 14px 44px;
color: var(--white);
font-family: "Exo 2",sans-serif;
font-size: 1rem;
outline: none;
transition: border-color 0.2s;
}
.big-search-wrap input:focus {
border-color: var(--gold);
box-shadow: 0 0 0 3px rgba(245,168,0,0.1);
}
.big-search-wrap input::placeholder {
color: rgba(255,255,255,0.2);
}
.btn-go {
padding: 14px 24px;
background: linear-gradient(135deg,var(--gold),#e09500);
color: var(--black);
border: none;
border-radius: 10px;
font-family: "Orbitron",monospace;
font-weight: 700;
font-size: 0.88rem;
cursor: pointer;
transition: all 0.2s;
white-space: nowrap;
}
.btn-go:hover {
transform: translateY(-2px);
box-shadow: 0 8px 20px rgba(245,168,0,0.3);
}

.filter-tabs {
position: relative;
z-index: 1;
padding: 14px 20px;
display: flex;
gap: 8px;
border-bottom: 1px solid rgba(255,255,255,0.05);
overflow-x: auto;
justify-content: center;
}
.tab-btn {
padding: 7px 18px;
border-radius: 20px;
border: 1.5px solid rgba(255,255,255,0.1);
background: transparent;
color: var(--gray);
font-size: 0.82rem;
font-weight: 600;
cursor: pointer;
white-space: nowrap;
transition: all 0.2s;
}
.tab-btn.active {
background: rgba(245,168,0,0.1);
border-color: var(--gold);
color: var(--gold);
}
.tab-count {
background: rgba(255,255,255,0.08);
border-radius: 8px;
padding: 1px 6px;
font-size: 0.68rem;
margin-left: 4px;
}

.main {
position: relative;
z-index: 1;
max-width: 800px;
margin: 0 auto;
padding: 24px 16px 60px;
}

.initial-state {
text-align: center;
padding: 60px 20px;
color: var(--gray);
}
.initial-icon {
font-size: 3rem;
margin-bottom: 14px;
}
.initial-title {
font-family: "Orbitron",monospace;
font-size: 1rem;
color: var(--white);
opacity: 0.5;
margin-bottom: 8px;
}
.suggestions {
display: flex;
flex-wrap: wrap;
gap: 8px;
justify-content: center;
margin-top: 20px;
}
.suggestion-tag {
padding: 6px 14px;
border-radius: 20px;
background: rgba(255,255,255,0.04);
border: 1px solid rgba(255,255,255,0.08);
font-size: 0.8rem;
color: var(--gray);
cursor: pointer;
transition: all 0.2s;
}
.suggestion-tag:hover {
border-color: var(--gold);
color: var(--gold);
}


.results-section {
margin-bottom: 28px;
}
.section-title {
font-family: "Orbitron",monospace;
font-size: 0.75rem;
color: var(--gold);
letter-spacing: 1.5px;
margin-bottom: 12px;
display: flex;
align-items: center;
gap: 8px;
}
.section-count {
background: rgba(245,168,0,0.1);
border: 1px solid rgba(245,168,0,0.2);
color: var(--gold);
padding: 2px 8px;
border-radius: 8px;
font-size: 0.7rem;
}

.member-list {
display: flex;
flex-direction: column;
gap: 10px;
}
.member-card {
display: flex;
align-items: center;
gap: 12px;
padding: 14px 16px;
background: var(--card);
border: 1px solid rgba(255,255,255,0.07);
border-radius: 10px;
cursor: pointer;
transition: all 0.2s;
}
.member-card:hover {
border-color: rgba(245,168,0,0.2);
transform: translateX(3px);
}
.member-avatar {
width: 44px;
height: 44px;
border-radius: 50%;
background: linear-gradient(135deg,var(--gold),var(--blue));
display: flex;
align-items: center;
justify-content: center;
font-weight: 700;
font-size: 0.9rem;
flex-shrink: 0;
overflow: hidden;
}
.member-avatar img {
width: 100%;
height: 100%;
object-fit: cover;
border-radius: 50%;
}
.member-info {
flex: 1;
}
.member-name {
font-weight: 700;
font-size: 0.9rem;
margin-bottom: 2px;
}
.member-username {
font-size: 0.75rem;
color: var(--blue);
margin-bottom: 4px;
}
.member-bio {
font-size: 0.78rem;
color: var(--gray);
display: -webkit-box;
-webkit-line-clamp: 1;
-webkit-box-orient: vertical;
overflow: hidden;
}
.member-tags {
display: flex;
gap: 6px;
flex-wrap: wrap;
margin-top: 4px;
}
.member-tag {
font-size: 0.68rem;
padding: 2px 8px;
border-radius: 8px;
background: rgba(26,111,232,0.08);
color: #7ab3ff;
border: 1px solid rgba(26,111,232,0.15);
}
.member-pts {
font-family: "Orbitron",monospace;
font-size: 0.85rem;
font-weight: 700;
color: var(--gold);
}
.member-role {
font-size: 0.72rem;
color: var(--gray);
}
.btn-msg {
padding: 6px 14px;
background: var(--blue);
color: var(--white);
border: none;
border-radius: 6px;
font-size: 0.78rem;
font-weight: 600;
cursor: pointer;
flex-shrink: 0;
}

.post-list {
display: flex;
flex-direction: column;
gap: 10px;
}
.post-result {
display: flex;
gap: 12px;
padding: 14px 16px;
background: var(--card);
border: 1px solid rgba(255,255,255,0.07);
border-radius: 10px;
cursor: pointer;
transition: all 0.2s;
}
.post-result:hover {
border-color: rgba(245,168,0,0.2);
transform: translateX(3px);
}
.post-vote {
font-family: "Orbitron",monospace;
font-size: 0.85rem;
font-weight: 700;
color: var(--gold);
min-width: 30px;
text-align: center;
padding-top: 4px;
}
.post-body {
flex: 1;
}
.post-meta {
display: flex;
gap: 8px;
margin-bottom: 6px;
flex-wrap: wrap;
align-items: center;
}
.post-badge {
font-size: 0.65rem;
font-weight: 700;
padding: 2px 8px;
border-radius: 8px;
font-family: "Orbitron",monospace;
}
.badge-q {
background: rgba(26,111,232,0.12);
color: #7ab3ff;
border: 1px solid rgba(26,111,232,0.3);
}
.badge-t {
background: rgba(245,168,0,0.12);
color: var(--gold);
border: 1px solid rgba(245,168,0,0.3);
}
.badge-d {
background: rgba(168,85,247,0.12);
color: #c084fc;
border: 1px solid rgba(168,85,247,0.3);
}
.post-author {
font-size: 0.72rem;
color: var(--gray);
}
.post-author strong {
color: var(--blue);
}
.post-title {
font-family: "Orbitron",monospace;
font-size: 0.85rem;
font-weight: 700;
margin-bottom: 5px;
line-height: 1.4;
}
.post-result:hover .post-title {
color: var(--gold);
}
.post-excerpt {
font-size: 0.78rem;
color: var(--gray);
line-height: 1.5;
display: -webkit-box;
-webkit-line-clamp: 2;
-webkit-box-orient: vertical;
overflow: hidden;
}

.no-results {
text-align: center;
padding: 40px 20px;
color: var(--gray);
}
.no-results-icon {
font-size: 2.5rem;
margin-bottom: 10px;
}

.spinner {
width: 30px;
height: 30px;
border: 3px solid rgba(245,168,0,0.2);
border-top-color: var(--gold);
border-radius: 50%;
animation: spin 0.8s linear infinite;
margin: 30px auto;
}
@keyframes spin {
to {
transform: rotate(360deg);
}
}

.highlight {
background: rgba(245,168,0,0.2);
color: var(--gold);
border-radius: 3px;
padding: 0 2px;
}

@media(max-width:600px) {
.nav-links {
display: none;
}

.filter-tabs {
justify-content: flex-start;
}
}
</style>
</head>

<script type="module">
import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
getFirestore,
collection,
getDocs,
doc,
getDoc,
query,
orderBy,
limit,
where
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
apiKey: "AIzaSyBXDDwYx0FPnJBc6vkgLPzeIJk6hiEVMEw", authDomain: "code-share-2c4ea.firebaseapp.com", projectId: "code-share-2c4ea", storageBucket: "code-share-2c4ea.firebasestorage.app", messagingSenderId: "706094984093", appId: "1:706094984093:web:bd62bbed06c156bb5c1d74"
});
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let results = {
members: [],
posts: [],
tutorials: []
};
let activeTab = "all";

onAuthStateChanged(auth, async user => {
currentUser = user;
const navAv = document.getElementById("navAvatar");
if (user) {
try {
const ud = await getDoc(doc(db, "users", user.uid));
if (ud.exists() && ud.data().photoBase64) navAv.innerHTML = "<img src=\""+ud.data().photoBase64+"\"/>";
else navAv.textContent = (user.displayName || user.email).substring(0, 2).toUpperCase();
} catch(e) {
navAv.textContent = user.email.substring(0, 2).toUpperCase();
}
} else navAv.textContent = "?";


const params = new URLSearchParams(window.location.search);
const q = params.get("q");
if (q) {
document.getElementById("mainSearch").value = q; doSearch();
}
});

window.quickSearch = function(term) {
document.getElementById("mainSearch").value = term;
doSearch();
};

window.doSearch = async function() {
const query_str = document.getElementById("mainSearch").value.trim().toLowerCase();
if (!query_str) return;

document.getElementById("mainContent").innerHTML = "<div class=\"spinner\"></div>";
document.getElementById("filterTabs").style.display = "flex";

results = {
members: [],
posts: [],
tutorials: []
};

try {

const usersSnap = await getDocs(collection(db, "users"));
results.members = usersSnap.docs
.map(d => ({
id: d.id, ...d.data()}))
.filter(u => currentUser ? u.id !== currentUser.uid: true)
.filter(u =>
u.username?.toLowerCase().includes(query_str) ||
u.firstName?.toLowerCase().includes(query_str) ||
u.lastName?.toLowerCase().includes(query_str) ||
u.bio?.toLowerCase().includes(query_str) ||
(u.languages || []).some(l => l.toLowerCase().includes(query_str))
);


const postsSnap = await getDocs(collection(db, "posts"));
const allPosts = postsSnap.docs.map(d => ({
id: d.id, ...d.data()}));
const filtered = allPosts.filter(p =>
p.title?.toLowerCase().includes(query_str) ||
p.content?.toLowerCase().includes(query_str) ||
(p.tags || []).some(t => t.toLowerCase().includes(query_str))
);
results.posts = filtered.filter(p => p.type !== "tutorial");
results.tutorials = filtered.filter(p => p.type === "tutorial");

const total = results.members.length + results.posts.length + results.tutorials.length;
document.getElementById("cnt-all").textContent = total;
document.getElementById("cnt-members").textContent = results.members.length;
document.getElementById("cnt-posts").textContent = results.posts.length;
document.getElementById("cnt-tutorials").textContent = results.tutorials.length;

renderResults(query_str);
} catch(e) {
document.getElementById("mainContent").innerHTML = "<div class=\"no-results\"><div class=\"no-results-icon\"></div><p>Erreur: "+e.message+"</p></div>";
}
};

function escapeHtml(text) {
return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function highlight(text, query) {
if (!text) return "";
const safe = escapeHtml(text);
const re = new RegExp("("+query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")+")", "gi");
return safe.replace(re, '<span class="highlight">$1</span>');
}

function renderResults(q) {
const container = document.getElementById("mainContent");
const total = results.members.length + results.posts.length + results.tutorials.length;

if (total === 0) {
container.innerHTML = `<div class="no-results"><div class="no-results-icon"></div><p>Aucun résultat pour "<strong>${escapeHtml(q)}</strong>"</p><p style="margin-top:8px;font-size:0.8rem;">Essaie d\'autres mots-clés</p></div>`;
return;
}

let html = "";


if ((activeTab === "all" || activeTab === "members") && results.members.length > 0) {
html += `<div class="results-section">
<div class="section-title">MEMBRES <span class="section-count">${results.members.length}</span></div>
<div class="member-list">`;
results.members.forEach(u => {
const name = u.firstName ? u.firstName+" "+u.lastName: u.username || "Membre";
const avHtml = u.photoBase64 ? "<img src=\""+u.photoBase64+"\"/>": name.substring(0, 2).toUpperCase();
const langs = (u.languages || []).slice(0, 3).map(l => "<span class=\"member-tag\">"+escapeHtml(l)+"</span>").join("");
html += `<div class="member-card" onclick="window.location.href='profile.html'">
<div class="member-avatar">${avHtml}</div>
<div class="member-info">
<div class="member-name">${highlight(name, q)}</div>
<div class="member-username">@${highlight(u.username || "", q)}</div>
<div class="member-bio">${highlight(u.bio || "Pas de biographie", q)}</div>
<div class="member-tags">${langs}</div>
</div>
<div style="text-align:right;flex-shrink:0;">
<div class="member-pts">${u.points || 0} pts</div>
<div class="member-role">${u.role === "mentor"?"⭐ Mentor": "🎓 Apprenant"}</div>
${currentUser ? `<button class="btn-msg" onclick="event.stopPropagation();window.location.href='messages.html'">💬</button>` : ""}
</div>
</div>`;
});
html += "</div></div>";
}


if ((activeTab === "all" || activeTab === "posts") && results.posts.length > 0) {
const bMap = {
question: "badge-q",
discussion: "badge-d"
};
const lMap = {
question: "QUESTION",
discussion: "DISCUSSION"
};
html += `<div class="results-section">
<div class="section-title">POSTS <span class="section-count">${results.posts.length}</span></div>
<div class="post-list">`;
results.posts.forEach(p => {
html += `<div class="post-result" onclick="window.location.href='community.html'">
<div class="post-vote">❤️ ${p.votes || 0}</div>
<div class="post-body">
<div class="post-meta">
<span class="post-badge ${bMap[p.type] || "badge-q"}">${lMap[p.type] || "POST"}</span>
<span class="post-author">par <strong>@${escapeHtml(p.username || "anonyme")}</strong></span>
</div>
<div class="post-title">${highlight(p.title, q)}</div>
<div class="post-excerpt">${highlight(p.content, q)}</div>
</div>
</div>`;
});
html += "</div></div>";
}

if ((activeTab === "all" || activeTab === "tutorials") && results.tutorials.length > 0) {
html += `<div class="results-section">
<div class="section-title">TUTORIELS <span class="section-count">${results.tutorials.length}</span></div>
<div class="post-list">`;
results.tutorials.forEach(p => {
html += `<div class="post-result" onclick="window.location.href='tutorials.html'">
<div class="post-vote">❤️ ${p.votes || 0}</div>
<div class="post-body">
<div class="post-meta">
<span class="post-badge badge-t">TUTORIEL</span>
<span class="post-author">par <strong>@${escapeHtml(p.username || "anonyme")}</strong></span>
</div>
<div class="post-title">${highlight(p.title, q)}</div>
<div class="post-excerpt">${highlight(p.content, q)}</div>
</div>
</div>`;
});
html += "</div></div>";
}

container.innerHTML = html || `<div class="no-results"><div class="no-results-icon"></div><p>Aucun résultat dans cette catégorie.</p></div>`;
}

window.filterTab = function(tab, el) {
activeTab = tab;
document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
el.classList.add("active");
const q = document.getElementById("mainSearch").value.trim().toLowerCase();
if (q) renderResults(q);
};
</script>
