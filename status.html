<title>Code-Share — Statuts</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght=700;900&family=Exo+2:wght=300;400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<style>
:root {
--gold: #F5A800;
--blue: #1A6FE8;
--black: #0A0A0A;
--card: #16191F;
--white: #FFFFFF;
--gray: #8892A4;
--neon-red: #FF3333;
}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
background: var(--black);
color: var(--white);
font-family: sans-serif;
overflow-x: hidden;
}
body::before {
content: "";
position: fixed;
inset: 0;
background-size: 60px 60px;
pointer-events: none;
z-index: 0;
}

nav {
position: fixed;
top: 0;
left: 0;
right: 0;
z-index: 100;
display: flex;
align-items: center;
justify-content: space-between;
padding: 18px 40px;
background: rgba(10,10,10,0.9);
backdrop-filter: blur(12px);
border-bottom: 1px solid rgba(245,168,0,0.15);
}
.nav-logo {
display: flex;
align-items: center;
gap: 10px;
text-decoration: none;
cursor: none;
}
.nav-logo img {
width: 40px;
height: 40px;
object-fit: contain;
border-radius: 50px;
}
.logo-text {
font-family: "Orbitron",monospace;
font-size: 1rem;
font-weight: 700;
color:var(--white);
}
.logo-text .b {
color: var(--blue);
}

.logo-text .g {
color: var(--gold);
}
.nav-links {
display: flex;
gap: 28px;
list-style: none;
}
.nav-links a {
color: var(--gray);
text-decoration: none;
font-size: 0.88rem;
font-weight: 600;
transition: color 0.2s;
cursor:none;
}
.nav-links a:hover {
color: var(--gold);
}
.nav-actions {
display: flex;
gap: 10px;
}
.container {
position: relative;
z-index: 1;
max-width: 680px;
margin: 0 auto;
padding: 90px 16px 24px;
}
.page-title {
font-family: "Orbitron", monospace;
font-size: 1.6rem;
font-weight: 900;
margin-bottom: 20px;
text-align: center;
color: none;
}
.page-title span {
color: var(--gold);
}

.status-tray {
display: flex;
flex-direction: column;
gap: 2px;
margin-bottom: 24px;
border:none;
border-radius: 12px;
overflow: hidden;
background: var(--black);
}

.status-img-fullscreen {
display: none;
position: fixed;
inset: 0;
background:var(--black);
z-index: 500;
align-items: center;
justify-content: center;
padding: 20px;
}
.status-img-fullscreen.open {
display: flex;
}
.status-img-fullscreen img {
max-width: 100%;
max-height: 90vh;
object-fit: contain;
border-radius: 8px;
}
.status-fullscreen-close {
position: absolute;
top: 16px;
right: 16px;
background: transparent;
border: none;
color:var(--white);
font-size: 1.5rem;
cursor:none;
}
.tray-row {
display: flex;
align-items: center;
gap: 12px;
padding: 10px 14px;
cursor: none;
transition: background 0.15s;
border:none;
}
.tray-section-label {
padding: 12px 14px 6px;
font-size: 0.72rem;
font-weight: 700;
color:var(--white);
text-transform: uppercase;
letter-spacing: 0.4px;
background:var(--black);
}
.tray-row:last-child {
border-bottom: none;
}
.tray-row:hover {
background: rgba(255,255,255,0.03);
}

.tray-item {
display: none;
}

.avatar-wrapper {
position: relative;
width: 52px;
height: 52px;
border-radius: 50%;
padding: 3px;
border: 2.5px solid rgba(255, 255, 255, 0.15);
box-sizing: border-box;
flex-shrink: 0;
}
.tray-row.unread .avatar-wrapper {
border-color: var(--gold);
}
.avatar-wrapper img, .avatar-wrapper .text-avatar {
width: 100%;
height: 100%;
border-radius: 50%;
object-fit: cover;
background: var(--black);
display: flex;
align-items: center;
justify-content: center;
font-weight: bold;
color: var(--gold);
}
.add-status-btn {
position: absolute;
bottom: 0;
right: 0;
width: 18px;
height: 18px;
background: var(--blue);
color:var(--white);
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 0.7rem;
border: 2px solid var(--card);
cursor:none;
}

.tray-info {
display: flex;
flex-direction: column;
gap: 2px;
min-width: 0;
flex: 1;
}
.tray-name {
font-size: 0.88rem;
font-weight: 600;
color:var(--white);
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.tray-name.clickable:hover {
color: var(--gold);
text-decoration: underline;
}
.tray-sub {
font-size: 0.74rem;
color: var(--gray);
}

.publish-card {
background: var(--black);
border:none;
border-radius: 12px;
overflow: hidden;
margin-bottom: 24px;
scroll-margin-top: 90px;
}
.card-header {
background:var(--black);
color:var(--white);
padding: 12px 18px;
display: flex;
justify-content: center;
align-items: center;
gap: 8px;
}
.dot {
width: 10px;
height: 10px;
border-radius: 50%;
}
.dot-r {
background: #FF5F57;
}
.dot-y {
background: #FFBD2E;
}
.dot-g {
background: #28C840;
}
.card-title {
margin-left: 8px;
font-size: 0.75rem;
color:var(--white);
font-family: "Orbitron", monospace;
}

.publish-body {
padding: 16px;
}
.status-textarea {
width: 100%;
background: transparent;
border: none;
outline: none;
color:var(--white);
font-family: sans-serif;
font-size: 0.95rem;
resize: none;
min-height: 60px;
}
.media-preview-container {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
gap: 10px;
margin-top: 10px;
}
.media-preview {
position: relative;
aspect-ratio: 1;
border-radius: 6px;
overflow: hidden;
border:none;
}
.media-preview img {
width: 100%;
height: 100%;
object-fit: cover;
}
.remove-media {
position: absolute;
top: 4px;
right: 4px;
background: rgba(0,0,0,0.7);
color: var(--white);
border: none;
border-radius: 50%;
width: 20px;
height: 20px;
cursor:none;
}

.publish-footer {
display: flex;
justify-content: space-between;
align-items: center;
padding: 12px 16px;
background: var(--black);
}
.media-actions {
display: flex;
gap: 14px;
}
.media-label {
color:var(--white);
cursor: none;
font-size: 1.1rem;
}
.media-label:hover {
color: var(--gold);
}
.media-label input {
display: none;
}

.btn-submit-status {
padding: 8px 20px;
background:var(--blue);
color:var(--white);
border: none;
border-radius: 6px;
font-family: "Orbitron", monospace;
font-weight: 700;
font-size: 0.8rem;
cursor:none;
}

.status-feed {
display: flex;
flex-direction: column;
gap: 20px;
padding-bottom: 80px;
}
.status-post {
background: var(--black);
border:none;
border-radius: 12px;
padding: 16px;
display: flex;
flex-direction: column;
position: relative;
}
.post-user-info {
display: flex;
align-items: center;
gap: 10px;
margin-bottom: 12px;
}
.post-username {
font-family: "Orbitron", monospace;
font-size: 0.85rem;
font-weight: 700;
color: var(--blue);
}
.badge-subscriber {
background: rgba(245, 168, 0, 0.15);
color: var(--gold);
font-size: 0.65rem;
padding: 2px 6px;
border-radius: 4px;
font-weight: 600;
border: 1px solid rgba(245, 168, 0, 0.3);
}
.post-time {
font-size: 0.7rem;
color:var(--white);
margin-left: auto;
margin-right: 10px;
}

.btn-delete-status {
background: transparent;
border: none;
color:var(--white);
cursor: pointer;
font-size: 0.9rem;
transition: color 0.2s;
}
.btn-delete-status:hover {
color: var(--neon-red);
}

.post-text {
font-size: 0.9rem;
line-height: 1.5;
color:var(--white);
margin-bottom: 12px;
}
.post-media {
width: 100%;
border-radius: 8px;
overflow: hidden;
border: 1px solid rgba(255,255,255,0.05);
margin-bottom: 12px;
max-height: 380px;
}
.post-media img {
width: 100%;
height: 100%;
object-fit: cover;
}

.post-actions-bar {
display: flex;
align-items: center;
gap: 20px;
border-top: 1px solid rgba(255,255,255,0.05);
padding-top: 12px;
margin-bottom: 12px;
}
.action-btn {
background: transparent;
border: none;
color: var(--white);
font-family: sans-serif;
font-size: 0.85rem;
cursor: pointer;
display: flex;
align-items: center;
gap: 6px;
transition: color 0.2s;
}
.action-btn:hover {
color: var(--gold);
}
.action-btn.liked {
color: var(--gold);
}

.whatsapp-reply-box {
display: flex;
align-items: center;
gap: 10px;
background:var(--black);
border: 1px solid rgba(255,255,255,0.08);
padding: 6px 12px;
border-radius: 20px;
}
.reply-input {
flex: 1;
background: transparent;
border: none;
outline: none;
color:var(--white);
font-family: sans-serif;
font-size: 0.85rem;
}
.btn-send-dm {
background: transparent;
border: none;
color: var(--blue);
cursor: none;
font-size: 0.95rem;
transition: color 0.2s;
}
.btn-send-dm:hover {
color: var(--gold);
}

.views-section {
margin-bottom: 12px;
}
.views-toggle {
display: inline-flex;
align-items: center;
gap: 6px;
color:#E2E5E7;
font-size: 0.8rem;
cursor: pointer;
transition: color 0.2s;
}
.views-toggle:hover {
color: var(--gold);
}
.viewers-list {
margin-top: 8px;
background: rgba(10,10,10,0.5);
border: 1px solid rgba(255,255,255,0.08);
border-radius: 10px;
padding: 8px;
max-height: 200px;
overflow-y: auto;
}
.viewer-item {
display: flex;
align-items: center;
gap: 8px;
padding: 6px 4px;
cursor: none;
border-radius: 6px;
transition: background 0.2s;
}
.viewer-item:hover {
background: rgba(255,255,255,0.05);
}
.viewer-item img {
width: 24px;
height: 24px;
border-radius: 50%;
object-fit: cover;
}
.viewer-item span {
font-size: 0.82rem;
color: var(--white);
}
.no-views {
font-size: 0.8rem;
color: var(--gray);
padding: 4px;
margin: 0;
}

.bottom-bar {
position: fixed;
bottom: 0;
left: 0;
width: 100%;
height: 72px;
background: rgba(10,10,10,0.9);
display: flex;
justify-content: space-around;
align-items: center;
z-index: 999;
}

.bottom-item {
flex: 1;
text-decoration: none;
color:var(--white);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 5px;
font-size: .75rem;
transition: .3s;

}

.bottom-item i {
font-size: 1.2rem;
}

.bottom-item:hover,
.bottom-item.active {
color: var(--gold);
border-radius: 50px;
overflow: hidden;
}

@media(min-width:769px) {
.bottom-bar {
display: none;
}
}

</style>

<script type="module">

import {
getApps, getApp, initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import "./onesignal-config.js";
import {
getFirestore, collection, addDoc, doc, setDoc, getDoc, getDocs, getCountFromServer, updateDoc, deleteDoc, arrayUnion, arrayRemove, query, where, orderBy, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import {
getAuth, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const app = getApps().length ? getApp() : initializeApp({
apiKey: "AIzaSyBXDDwYx0FPnJBc6vkgLPzeIJk6hiEVMEw",
authDomain: "code-share-2c4ea.firebaseapp.com",
projectId: "code-share-2c4ea",
storageBucket: "code-share-2c4ea.firebasestorage.app",
messagingSenderId: "706094984093",
appId: "1:706094984093:web:bd62bbed06c156bb5c1d74"
});
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let myData = {};
let selectedFiles = [];

const statusDataMap = {};

const viewCountCache = {};


onAuthStateChanged(auth, async (user) => {

    if (user) {

        currentUser = user;


initOneSignal(user.uid);


        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists()) {
            myData = userDoc.data();
            

            const myTrayAvatar = document.getElementById('myTrayAvatar');
            if (myData.photoBase64 && myTrayAvatar) {
                myTrayAvatar.outerHTML = `<img src="${myData.photoBase64}" alt="Moi">`;
            }
        }


        loadStatuses();

       
        setDoc(doc(db, "users", user.uid), {
            lastSeenStatusAt: serverTimestamp()
        }, {
            merge: true
        }).catch(() => {});

    } else {

        window.location.href = "login.html";
    }
});

window.handleMediaSelect = function(event) {
const file = event.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = function(e) {
selectedFiles = [{
file,
base64: e.target.result
}];
renderPreviews();
};
reader.readAsDataURL(file);
};

function renderPreviews() {
const container = document.getElementById('mediaPreviewContainer');
container.innerHTML = '';
selectedFiles.forEach((item, index) => {
const previewDiv = document.createElement('div');
previewDiv.className = 'media-preview';
previewDiv.innerHTML = `<img src="${item.base64}"><button class="remove-media" onclick="removeMedia(${index})">✕</button>`;
container.appendChild(previewDiv);
});
}

window.removeMedia = function(index) {
selectedFiles.splice(index, 1);
renderPreviews();
};

window.publishStatus = async function() {
const text = document.getElementById('statusText').value.trim();
if (!text && selectedFiles.length === 0) return;

const btn = document.querySelector('.btn-submit-status');
btn.disabled = true;
btn.innerText = "POSTAGE...";

try {
let mediaDataUrl = null;
if (selectedFiles.length > 0) {
mediaDataUrl = selectedFiles[0].base64;
}

await addDoc(collection(db, "statuses"), {
userId: currentUser.uid,
username: myData.username || "Développeur",
userAvatar: myData.photoBase64 || "",
text: text,
mediaUrl: mediaDataUrl,
likes: [],
createdAt: serverTimestamp()
});

document.getElementById('statusText').value = '';
selectedFiles = [];
renderPreviews();
} catch (e) {
showToast("Erreur lors de la publication : " + e.message, "error");
} finally {
btn.disabled = false;
btn.innerText = "POSTER";
}
};


window.deleteStatus = async function(postId) {
const ok = await showConfirm("Cette action est irréversible.", {
title: "Supprimer ce statut ?",
danger: true,
confirmLabel: "Supprimer"
});
if (ok) {
try {
await deleteDoc(doc(db, "statuses", postId));
} catch (error) {
showToast("Erreur lors de la suppression : " + error.message, "error");
}
}
};

async function loadStatuses() {
const statusFeed = document.getElementById('statusFeed');
const statusTray = document.getElementById('statusTray');


const myFollowing = myData.following || [];
const myFollowedBy = myData.followedBy || [];
const mutualUsers = myFollowing.filter(uid => myFollowedBy.includes(uid));
const allowedUsers = [currentUser.uid,
...mutualUsers];


const cutoff = new Date(Date.now() - 24 * 60 * 60 * 1000);
const qStatuses = query(
collection(db, "statuses"),
where("createdAt", ">", cutoff),
orderBy("createdAt", "desc")
);

onSnapshot(qStatuses, (snapshot) => {
statusFeed.innerHTML = '';
statusTray.innerHTML = `
<div class="tray-row" onclick="scrollToComposer()">
<div class="avatar-wrapper">
${myData.photoBase64 ? `<img src="${myData.photoBase64}">`: `<div class="text-avatar">Moi</div>`}
<div class="add-status-btn" onclick="event.stopPropagation(); scrollToComposer();"><i class="fa-solid fa-plus"></i></div>
</div>
<div class="tray-info">
<div class="tray-name">Mon statut</div>
<div class="tray-sub">Toucher pour ajouter un statut</div>
</div>
</div>
<div class="tray-section-label" id="traySectionLabel" style="display:none;">Mises à jour récentes</div>
`;

const unDePlusDe24h = 24 * 60 * 60 * 1000; 
snapshot.forEach((docSnap) => {
const data = docSnap.data();
const id = docSnap.id;


if (data.createdAt) {
const ageMs = Date.now() - data.createdAt.toMillis();
if (ageMs > unDePlusDe24h) {
return; 
}
}


if (!allowedUsers.includes(data.userId)) {
return;
}

const hasLiked = data.likes && data.likes.includes(currentUser.uid);
const likesCount = data.likes ? data.likes.length: 0;

let timeText = "À l'instant";
if (data.createdAt) {
const ms = Date.now() - data.createdAt.toMillis();
const min = Math.floor(ms / 60000);
if (min < 1) timeText = "À l'instant";
else if (min < 60) timeText = `Il y a ${min} min`;
else timeText = `Il y a ${Math.floor(min/60)} h`;
}


const isMyStatus = data.userId === currentUser.uid;
const deleteBtnHtml = isMyStatus ? `
<button class="btn-delete-status" onclick="deleteStatus('${id}')" title="Supprimer mon statut">
<i class="fa-solid fa-trash"></i>
</button>
`: '';


statusDataMap[id] = {
text: data.text || '',
mediaUrl: data.mediaUrl || null,
username: data.username
};

const viewsHtml = isMyStatus ? `
<div class="views-section">
<span class="views-toggle" onclick="toggleViewersList('${id}')">
<i class="fa-solid fa-eye"></i> <span id="views-count-${id}">0</span> vues
</span>
<div class="viewers-list" id="viewers-list-${id}" style="display:none;"></div>
</div>
`: '';

const postHtml = `
<div class="status-post" id="${id}">
<div class="post-user-info">
<div class="avatar-wrapper" style="width:34px; height:34px; padding:1px; margin:0; cursor:pointer;" onclick="goToProfile('${data.userId}')">
${data.userAvatar ? `<img src="${data.userAvatar}">`: `<div class="text-avatar" style="font-size:0.7rem;">${data.username.substring(0, 2).toUpperCase()}</div>`}
</div>
<span class="post-username" style="cursor:pointer;" onclick="goToProfile('${data.userId}')">@${data.username}</span>
<span class="badge-subscriber"><i class="fa-solid fa-lock-open"></i> Abonné</span>
<span class="post-time">${timeText}</span>
${deleteBtnHtml}
</div>

${data.text ? `<p class="post-text">${escapeHtml(data.text)}</p>`: ''}

${data.mediaUrl ? `<div class="post-media"><img src="${data.mediaUrl}" alt="Média" onclick="openStatusFullscreen('${data.mediaUrl}')" style="cursor:zoom-in;" /></div>`: ''}

<div class="post-actions-bar">
<button class="action-btn ${hasLiked ? 'liked': ''}" onclick="toggleLike('${id}', ${hasLiked})">
<i class="fa-solid fa-heart"></i> <span>${likesCount}</span> Likes
</button>
</div>

${viewsHtml}

${!isMyStatus ? `
<div class="whatsapp-reply-box">
<input type="text" class="reply-input" placeholder="Répondre en message direct..." id="reply-input-${id}" />
<button class="btn-send-dm" onclick="sendReplyAsPrivateMessage('${data.userId}', '${data.username}', '${id}')">
<i class="fa-solid fa-paper-plane"></i>
</button>
</div>
` : ''}
</div>
`;
statusFeed.insertAdjacentHTML('beforeend', postHtml);

if (isMyStatus) {

if (viewCountCache[id] !== undefined) {
const el = document.getElementById(`views-count-${id}`);
if (el) el.textContent = viewCountCache[id];
} else {
getCountFromServer(collection(db, "statuses", id, "views")).then(snap => {
viewCountCache[id] = snap.data().count;
const el = document.getElementById(`views-count-${id}`);
if (el) el.textContent = snap.data().count;
}).catch(() => {});
}
} else {

recordStatusView(id, data.userId);
}

if (data.userId !== currentUser.uid) {
const trayHtml = `
<div class="tray-row unread">
<div class="avatar-wrapper" style="cursor:pointer;" onclick="scrollToUserStatus('${id}')" title="Voir le statut">
${data.userAvatar ? `<img src="${data.userAvatar}">`: `<div class="text-avatar">${data.username.substring(0, 2).toUpperCase()}</div>`}
</div>
<div class="tray-info">
<div class="tray-name clickable" onclick="event.stopPropagation(); goToProfile('${data.userId}')" title="Voir le profil">@${data.username}</div>
<div class="tray-sub">${timeText}</div>
</div>
</div>
`;
statusTray.insertAdjacentHTML('beforeend', trayHtml);
const sectionLabel = document.getElementById('traySectionLabel');
if (sectionLabel) sectionLabel.style.display = 'block';
}
});
});
}

window.toggleLike = async function(postId, hasLiked) {
const postRef = doc(db, "statuses", postId);
if (hasLiked) {
await updateDoc(postRef, {
likes: arrayRemove(currentUser.uid)
});
} else {
await updateDoc(postRef, {
likes: arrayUnion(currentUser.uid)
});
}
};


window.sendReplyAsPrivateMessage = async function(targetUserId, targetUsername, postId) {
const inputField = document.getElementById(`reply-input-${postId}`);
const messageText = inputField.value.trim();
if (!messageText) return;

try {

const convQuery = query(collection(db, "conversations"), where("members", "array-contains", currentUser.uid));
const existingSnap = await getDocs(convQuery);
let convId = null;
existingSnap.forEach((d) => {
if ((d.data().members || []).includes(targetUserId)) convId = d.id;
});


let convRef;
if (convId) {
convRef = doc(db, "conversations", convId);

const existingConvSnap = await getDoc(convRef);
if ((existingConvSnap.data()?.blockedBy || []).length > 0) {
showToast("Impossible d'envoyer : conversation bloquée.", "error");
return;
}
} else {
convRef = doc(collection(db, "conversations"));
convId = convRef.id;
await setDoc(convRef, {
members: [currentUser.uid, targetUserId],
createdAt: serverTimestamp(),
lastMessageAt: serverTimestamp(),
lastMessage: "",
unreadBy: [],
typingUsers: {}
});
}


const statusInfo = statusDataMap[postId] || {};
const replyContext = {
type: "status",
statusId: postId,
preview: statusInfo.text ? statusInfo.text.substring(0, 120): (statusInfo.mediaUrl ? "📷 Photo": "Statut"),
mediaThumb: statusInfo.mediaUrl || null
};


await addDoc(collection(db, "conversations", convId, "messages"), {
text: messageText,
senderId: currentUser.uid,
senderName: myData.username || "Développeur",
createdAt: serverTimestamp(),
replyContext
});


await setDoc(convRef, {
lastMessage: `📱 ${messageText.length > 50 ? messageText.substring(0, 50)+"...": messageText}`,
lastMessageAt: serverTimestamp(),
unreadBy: [targetUserId],
deletedBy: arrayRemove(currentUser.uid, targetUserId)
}, {
merge: true
});


await addDoc(collection(db, "users", targetUserId, "notifications"), {
type: "message",
senderName: myData.username || "Développeur",
senderPhoto: myData.photoBase64 || null,
message: "a répondu à votre statut",
link: "messages.html?conv=" + convId,
read: false,
createdAt: new Date()
}).catch(() => {});

showToast(`Commentaire envoyé en message privé à @${targetUsername} !`, "success");
inputField.value = '';
} catch (e) {
showToast("Erreur lors de l'envoi du message : " + e.message, "error");
}
};

function escapeHtml(text) {
return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}


window.scrollToComposer = function() {
const card = document.getElementById('publishCard');
if (!card) return;
card.scrollIntoView({
behavior: 'smooth', block: 'start'
});
const textarea = document.getElementById('statusText');
if (textarea) setTimeout(() => textarea.focus(), 400);
};


window.scrollToUserStatus = function(statusId) {
const card = document.getElementById(statusId);
if (!card) return;
card.scrollIntoView({
behavior: 'smooth', block: 'center'
});
card.style.transition = 'box-shadow 0.3s ease';
card.style.boxShadow = '0 0 0 2px var(--gold)';
setTimeout(() => {
card.style.boxShadow = '';
}, 1500);
};


window.goToProfile = function(uid) {
if (!uid) return;
if (uid === currentUser.uid) {
window.location.href = 'profile.html';
} else {
window.location.href = `user-profile.html?uid=${uid}`;
}
};

window.openStatusFullscreen = function(url) {
  document.getElementById("statusImgFullscreenImg").src = url;
  document.getElementById("statusImgFullscreen").classList.add("open");
};
window.closeStatusFullscreen = function() {
  document.getElementById("statusImgFullscreen").classList.remove("open");
};


const viewedThisSession = new Set();
window.recordStatusView = async function(statusId, ownerId) {
if (!currentUser || ownerId === currentUser.uid) return;
if (viewedThisSession.has(statusId)) return;
viewedThisSession.add(statusId);
try {
await setDoc(doc(db, "statuses", statusId, "views", currentUser.uid), {
username: myData.username || "Développeur",
avatar: myData.photoBase64 || null,
viewedAt: serverTimestamp()
});
} catch (e) {
console.error("Erreur lors de l'enregistrement de la vue :", e);
}
};



window.toggleViewersList = async function(statusId) {
const listEl = document.getElementById(`viewers-list-${statusId}`);
if (!listEl) return;

if (listEl.style.display === 'block') {
listEl.style.display = 'none';
return;
}
listEl.style.display = 'block';
listEl.innerHTML = '<p class="no-views">Chargement...</p>';

try {
const viewsSnap = await getDocs(collection(db, "statuses", statusId, "views"));

viewCountCache[statusId] = viewsSnap.size;
const countEl = document.getElementById(`views-count-${statusId}`);
if (countEl) countEl.textContent = viewsSnap.size;

if (viewsSnap.empty) {
listEl.innerHTML = '<p class="no-views">Personne n\'a encore vu ce statut.</p>';
return;
}
let html = '';
viewsSnap.forEach((v) => {
const vd = v.data();
const initials = (vd.username || "??").substring(0, 2).toUpperCase();
html += `
<div class="viewer-item" onclick="goToProfile('${v.id}')">
${vd.avatar ? `<img src="${vd.avatar}">`: `<div class="text-avatar" style="width:24px;height:24px;font-size:0.6rem;">${initials}</div>`}
<span>@${escapeHtml(vd.username || 'Utilisateur')}</span>
</div>
`;
});
listEl.innerHTML = html;
} catch (e) {
listEl.innerHTML = '<p class="no-views">Erreur lors du chargement des vues.</p>';
console.error(e);
}
};
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js')
    .then(reg => console.log('Service Worker enregistré:', reg.scope))
    .catch(err => console.log('Erreur Service Worker:', err));
}
