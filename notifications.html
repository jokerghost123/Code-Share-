<title>Code-Share — Notifications</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet" />

<style>
:root {
--gold: #F5A800;
--blue: #1A6FE8;
--black: #0A0A0A;
--card: #16191F;
--white: #FFFFFF;
--gray: #8892A4;
}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
background: var(--black);
color:var(--white);
font-family: sans-serif;
min-height: 100vh;
}
body::before {
content: "";
position: fixed;
inset: 0;
background-size: 60px 60px;
pointer-events: none;
z-index: 0;
}

nav {
position: sticky;
top: 0;
z-index: 100;
display: flex;
align-items: center;
justify-content: space-between;
padding: 14px 20px;
background: rgba(10,10,10,0.95);
backdrop-filter: blur(12px);
border-bottom: 1px solid rgba(245,168,0,0.15);
}
.nav-logo {
display: flex;
align-items: center;
gap: 10px;
cursor: none;
}
.nav-logo img {
width: 40px;
height: 40px;
object-fit: contain;
border-radius: 50%;
}
.logo-text {
font-family: "Orbitron",monospace;
font-size: 1rem;
font-weight: 700;
color: var(--white);;
}
.logo-text .b {
color: var(--blue);
}

.logo-text .g {
color: var(--gold);
}
.nav-links {
display: flex;
gap: 20px;
}
.nav-links a {
color: var(--gray);
text-decoration: none;
font-size: 0.82rem;
font-weight: 600;
cursor: pointer;
transition: color 0.2s;
}
.nav-links a:hover, .nav-links a.active {
color: var(--gold);
}
.nav-right {
display: flex;
align-items: center;
gap: 10px;
}
.nav-avatar {
width: 36px;
height: 36px;
border-radius: 50%;
background: var(--blue);
display: flex;
align-items: center;
justify-content: center;
font-weight: 700;
font-size: 0.8rem;
cursor: none;
border: 2px solid rgba(245,168,0,0.4);
overflow: hidden;
}
.nav-avatar img {
width: 100%;
height: 100%;
object-fit: cover;
border-radius: 50%;
}
.notif-bell {
position: relative;
cursor: none;
font-size: 1.2rem;
}
.notif-badge {
position: absolute;
top: -6px;
right: -6px;
background: var(--gold);
color: var(--black);
font-size: 0.6rem;
font-weight: 700;
width: 16px;
height: 16px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
}

.page-header {
position: relative;
z-index: 1;
padding: 28px 20px 22px;
background:var(--black);
}
.page-header h1 {
font-family: "Orbitron",monospace;
font-size: 1.6rem;
font-weight: 900;
margin-bottom: 6px;
}
.page-header h1 span {
color: var(--gold);
}
.page-header p {
color:var(--white);
font-size: 0.88rem;
}
.header-actions {
display: flex;
gap: 10px;
margin-top: 14px;
}
.btn-mark-all {
padding: 8px 16px;
background: var(--blue);
color:var(--white);
border-radius: 8px;
border: none;
font-family:sans-serif;
font-weight: 600;
font-size: 0.82rem;
cursor: none;
transition: all 0.2s;
}
.btn-mark-all:hover {
background: rgba(245,168,0,0.1);
}
.btn-clear-all {
padding: 8px 16px;
background:transparent;
border:none;
color: var(--white);
border-radius: 8px;
font-family:sans-serif;
font-weight: 600;
font-size: 0.82rem;
cursor: none;
transition: all 0.2s;
}
.btn-clear-all:hover {
background: rgba(255,77,77,0.08);
}

.filter-tabs {
position: relative;
z-index: 1;
padding: 14px 20px;
display: flex;
gap: 8px;
overflow-x: auto;
}
.tab-btn {
padding: 7px 16px;
border-radius: 20px;
border: none;
background: transparent;
color:var(--white);
font-size: 0.8rem;
font-weight: 600;
cursor: none;
white-space: nowrap;
transition: all 0.2s;
}
.tab-btn.active {
background: rgba(245,168,0,0.1);
border-color: var(--gold);
color: var(--gold);
}


.main {
position: relative;
z-index: 1;
max-width: 700px;
margin: 0 auto;
padding: 20px 16px 60px;
}


.notif-list {
display: flex;
flex-direction: column;
gap: 10px;
}
.notif-item {
display: flex;
align-items: flex-start;
gap: 12px;
padding: 14px 16px;
background: var(--card);
border: 1px solid rgba(255,255,255,0.07);
border-radius: 12px;
cursor: none;
transition: all 0.2s;
position: relative;
overflow: hidden;
}
.notif-item.unread {
border-left: 3px solid var(--gold);
background: rgba(245,168,0,0.04);
}
.notif-item.unread::before {
content: "";
position: absolute;
top: 0;
left: 0;
right: 0;
height: 2px;
background: linear-gradient(90deg,var(--gold),transparent);
}
.notif-item:hover {
border-color: rgba(245,168,0,0.25);
transform: translateX(3px);
}
.notif-icon-wrap {
width: 42px;
height: 42px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 1.1rem;
flex-shrink: 0;
}
.notif-icon-wrap.comment {
background: rgba(26,111,232,0.15);
}
.notif-icon-wrap.vote {
background: rgba(245,168,0,0.15);
}
.notif-icon-wrap.message {
background: rgba(168,85,247,0.15);
}
.notif-icon-wrap.badge {
background: rgba(40,200,64,0.15);
}
.notif-icon-wrap.mention {
background: rgba(255,107,107,0.15);
}
.notif-body {
flex: 1;
min-width: 0;
}
.notif-text {
font-size: 0.85rem;
line-height: 1.5;
margin-bottom: 4px;
}
.notif-text strong {
color: var(--blue);
}
.notif-text .highlight {
color: var(--gold);
}
.notif-time {
font-size: 0.72rem;
color: var(--gray);
}
.notif-unread-dot {
width: 8px;
height: 8px;
background: var(--gold);
border-radius: 50%;
flex-shrink: 0;
margin-top: 6px;
}
.notif-avatar {
width: 32px;
height: 32px;
border-radius: 50%;
background:var(--blue);
display: flex;
align-items: center;
justify-content: center;
font-size: 0.72rem;
font-weight: 700;
flex-shrink: 0;
overflow: hidden;
}
.notif-avatar img {
width: 100%;
height: 100%;
object-fit: cover;
border-radius: 50%;
}

.empty-state {
text-align: center;
padding: 60px 20px;
color: var(--gray);
}
.empty-icon {
font-size: 3rem;
margin-bottom: 12px;
}
.empty-title {
font-family: "Orbitron",monospace;
font-size: 0.9rem;
color: var(--white);
opacity: 0.5;
margin-bottom: 8px;
}

.spinner {
width: 30px;
height: 30px;
border: 3px solid rgba(245,168,0,0.2);
border-top-color: var(--gold);
border-radius: 50%;
animation: spin 0.8s linear infinite;
margin: 30px auto;
}
@keyframes spin {
to {
transform: rotate(360deg);
}
}

.date-sep {
text-align: center;
font-size: 0.72rem;
color: var(--gray);
padding: 10px 0;
position: relative;
}
.date-sep::before {
content: "";
position: absolute;
left: 0;
right: 0;
top: 50%;
height: 1px;
background: rgba(255,255,255,0.06);
}
.date-sep span {
background: var(--black);
padding: 0 10px;
position: relative;
}

@media(max-width:600px) {
.nav-links {
display: none;
}
}

    }

    currentUser = user;

    initOneSignal(user.uid);

    try {
        const ud = await getDoc(doc(db, "users", user.uid));
        const navAvatar = document.getElementById("navAvatar");
        
        if (ud.exists() && ud.data().photoBase64) {
            navAvatar.innerHTML = `<img src="${ud.data().photoBase64}" alt="Avatar" />`;
        } else {
            navAvatar.textContent = (user.displayName || user.email).substring(0, 2).toUpperCase();
        }
    } catch (error) {
        console.error("Erreur chargement avatar :", error);
    }

    const notifsRef = collection(db, "users", user.uid, "notifications");
    onSnapshot(query(notifsRef, orderBy("createdAt", "desc")), snap => {
        allNotifs = snap.docs.map(d => ({
            id: d.id,
            ...d.data()
        }));
        renderNotifs();
    });
});

function renderNotifs() {
const container = document.getElementById("notifContainer");
let notifs = [...allNotifs];
if (currentFilter !== "all") notifs = notifs.filter(n => n.type === currentFilter);

if (notifs.length === 0) {
container.innerHTML = `
<div class="empty-state">
<div class="empty-icon">🔔</div>
<div class="empty-title">Aucune notification</div>
<p>Tu seras notifié quand quelqu un interagit avec toi.</p>
</div>`;
return;
}

const unreadCount = notifs.filter(n => !n.read).length;

let html = "<div class=\"notif-list\">";
let lastDate = "";

notifs.forEach(n => {
const date = n.createdAt?.toDate ? n.createdAt.toDate(): new Date();
const dateStr = formatDate(date);
const info = NOTIF_ICONS[n.type] || NOTIF_ICONS.comment;
const avHtml = n.senderPhoto ? "<img src=\""+n.senderPhoto+"\"/>": (n.senderName || "?").substring(0, 2).toUpperCase();

if (dateStr !== lastDate) {
html += `<div class="date-sep"><span>${dateStr}</span></div>`;
lastDate = dateStr;
}

html += `<div class="notif-item ${n.read?"": "unread"}" onclick="openNotif('${n.id}','${n.type}','${n.link || ""}')">
<div class="notif-avatar">${avHtml}</div>
<div class="notif-icon-wrap ${info.class}">${info.icon}</div>
<div class="notif-body">
<div class="notif-text"><strong>@${escapeHtml(n.senderName || "Quelqu un")}</strong> ${escapeHtml(n.message || info.label)}${n.postTitle ? ' : <span class="highlight">"'+escapeHtml(n.postTitle.substring(0, 40))+'"</span>': ""}</div>
<div class="notif-time">${timeAgo(date)}</div>
</div>
${n.read ? "": '<div class="notif-unread-dot"></div>'}
</div>`;
});

html += "</div>";
container.innerHTML = html;
}

window.openNotif = async function(notifId, type, link) {
if (!currentUser) return;
try {
await updateDoc(doc(db, "users", currentUser.uid, "notifications", notifId), {
read: true
});
} catch(e) {}
if (link) window.location.href = link;
else if (type === "message") window.location.href = "messages.html";
else if (type === "badge") window.location.href = "reputation.html";
else window.location.href = "community.html";
};

window.markAllRead = async function() {
if (!currentUser) return;
try {
const batch = writeBatch(db);
allNotifs.filter(n => !n.read).forEach(n => {
batch.update(doc(db, "users", currentUser.uid, "notifications", n.id), {
read: true
});
});
await batch.commit();
} catch(e) {
showToast("Erreur: "+e.message, "error");
}
};

window.clearAll = async function() {
if (!currentUser) return;
if (!(await showConfirm("Vous ne pourrez pas les récupérer.", {
title: "Effacer toutes les notifications ?", danger: true, confirmLabel: "Tout effacer"
}))) return;
try {
const batch = writeBatch(db);
allNotifs.forEach(n => {
batch.delete(doc(db, "users", currentUser.uid, "notifications", n.id));
});
await batch.commit();
} catch(e) {
showToast("Erreur: "+e.message, "error");
}
};

window.filterNotifs = function(filter, el) {
currentFilter = filter;
document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
el.classList.add("active");
renderNotifs();
};

function escapeHtml(text) {
return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function timeAgo(date) {
const d = Math.floor((Date.now()-date)/1000);
if (d < 60) return "à l instant";
if (d < 3600) return "Il y a "+Math.floor(d/60)+"min";
if (d < 86400) return "Il y a "+Math.floor(d/3600)+"h";
return "Il y a "+Math.floor(d/86400)+" jour(s)";
}

function formatDate(date) {
const now = new Date();
const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
const diff = Math.floor((today-d)/86400000);
if (diff === 0) return "Aujourd hui";
if (diff === 1) return "Hier";
return date.toLocaleDateString("fr-FR", {
day: "numeric", month: "long"
});
}
