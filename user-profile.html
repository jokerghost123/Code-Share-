<title>Code-Share — Profil</title> 
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet" />

<style>
:root {
--gold: #F5A800;
--blue: #1A6FE8;
--black: #0A0A0A;
--card: #16191F;
--white: #FFFFFF;
--gray: #8892A4;
}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
background: var(--black);
color:var(--white);
font-family: sans-serif;
min-height: 100vh;
}
body::before {
content: "";
position: fixed;
inset: 0;
background-size: 60px 60px;
pointer-events: none;
z-index: 0;
}

nav {
position: sticky;
top: 0;
z-index: 100;
display: flex;
align-items: center;
justify-content: space-between;
padding: 14px 20px;
background: rgba(10,10,10,0.95);
backdrop-filter: blur(12px);
border-bottom: 1px solid rgba(245,168,0,0.15);
}
.nav-logo {
display: flex;
align-items: center;
gap: 10px;
cursor:none;
}
.nav-logo img {
width: 40px;
height: 40px;
object-fit: contain;
border-radius: 50%;
}
.logo-text {
font-family: "Orbitron",monospace;
font-size: 0.9rem;
font-weight: 700;
color:var(--white);
}
.logo-text .b {
color: var(--blue);
}

.logo-text .g {
color: var(--gold);
}
.nav-links {
display: flex;
gap: 20px;
}
.nav-links a {
color: var(--gray);
text-decoration: none;
font-size: 0.82rem;
font-weight: 600;
cursor:none;
transition: color 0.2s;
}
.nav-links a:hover {
color: var(--gold);
}
.nav-right {
display: flex;
align-items: center;
gap: 10px;
}
.nav-avatar {
width: 36px;
height: 36px;
border-radius: 50%;
background:var(--blue);
display: flex;
align-items: center;
justify-content: center;
font-weight: 700;
font-size: 0.8rem;
cursor:none;
border: px solid rgba(245,168,0,0.4);
overflow: hidden;
}
.nav-avatar img {
width: 100%;
height: 100%;
object-fit: cover;
border-radius: 50%;
}


.banner {
position: relative;
z-index: 1;
height: 160px;
background: linear-gradient(135deg,#0d1117,#1a1f2e);
overflow: hidden;
}
.banner::before {
content: "";
position: absolute;
inset: 0;
background: radial-gradient(circle at 20% 50%,rgba(245,168,0,0.12),transparent 50%),radial-gradient(circle at 80% 50%,rgba(26,111,232,0.12),transparent 50%);
}


.profile-section {
position: relative;
z-index: 1;
max-width: 900px;
margin: 0 auto;
padding: 0 20px;
}

.profile-top {
display: flex;
align-items: flex-end;
gap: 16px;
margin-top: -55px;
margin-bottom: 24px;
flex-wrap: wrap;
}

.avatar {
width: 100px;
height: 100px;
border-radius: 50%;
background:var(--blue);
border: 4px solid var(--black);
display: flex;
align-items: center;
justify-content: center;
font-size: 2.2rem;
font-weight: 700;
box-shadow: 0 8px 24px rgba(245,168,0,0.2);
overflow: hidden;
flex-shrink: 0;
}
.avatar img {
width: 100%;
height: 100%;
object-fit: cover;
border-radius: 50%;
}
.avatar-badge {
display: inline-block;
background: var(--gold);
color: var(--black);
font-size: 0.58rem;
font-weight: 700;
padding: 2px 8px;
border-radius: 8px;
font-family: "Orbitron",monospace;
margin-top: 6px;
}

.profile-info {
flex: 1;
padding-bottom: 6px;
min-width: 180px;
}
.profile-name {
font-family: "Orbitron",monospace;
font-size: 1.3rem;
font-weight: 900;
margin-bottom: 4px;
}
.profile-username {
color:var(--white);
font-size: 0.85rem;
margin-bottom: 10px;
}
.profile-username span {
color: var(--blue);
}
.profile-tags {
display: flex;
flex-wrap: wrap;
gap: 7px;
}
.tag {
padding: 3px 10px;
border-radius: 16px;
font-size: 0.72rem;
font-weight: 600;
border: 1px solid;
}
.tag-mentor {
background: rgba(245,168,0,0.1);
border-color: rgba(245,168,0,0.4);
color: var(--gold);
}
.tag-apprenant {
background: rgba(26,111,232,0.1);
border-color: rgba(26,111,232,0.3);
color: #7ab3ff;
}
.tag-lang {
background: rgba(26,111,232,0.08);
border-color: rgba(26,111,232,0.2);
color: #7ab3ff;
}

.profile-actions {
display: flex;
gap: 8px;
padding-bottom: 6px;
margin-left: auto;
flex-wrap: wrap;
}
.btn-follow {
padding: 9px 20px;
background:var(--blue);
color:var(--white);
border: none;
border-radius: 8px;
font-family:sans-serif;
font-weight: 700;
font-size: 0.85rem;
cursor:none;
transition: all 0.2s;
display: flex;
align-items: center;
gap: 6px;
}
.btn-follow:hover {
transform: translateY(-2px);
box-shadow: 0 8px 20px rgba(245,168,0,0.3);
}
.btn-follow.following {
background: transparent;
border: 1.5px solid var(--gold);
color: var(--gold);
}
.btn-follow.following:hover {
background: rgba(255,77,77,0.1);
border-color: #ff4d4d;
color: #ff4d4d;
}
.btn-message {
padding: 9px 20px;
background: var(--blue);
color:var(--white);
border: 1.5px solid var(--blue);
border-radius: 8px;
font-family:sans-serif;
font-weight: 700;
font-size: 0.85rem;
cursor:none;
transition: all 0.2s;
display: flex;
align-items: center;
gap: 6px;
}
.btn-message:hover {
background: #2a7fff;
transform: translateY(-2px);
box-shadow: 0 8px 20px rgba(26,111,232,0.3);
}

.main-grid {
display: grid;
grid-template-columns: 260px 1fr;
gap: 20px;
padding-bottom: 60px;
}
.card {
background: var(--black);
border: none)
border-radius: 12px;
padding: 20px;
margin-bottom: 16px;
}
.card-title {
font-family: "Orbitron",monospace;
font-size: 0.72rem;
font-weight: 700;
color: var(--gold);
letter-spacing: 1px;
margin-bottom: 14px;
}
.bio-text {
font-size: 0.85rem;
color: var(--gray);
line-height: 1.7;
}

.stats-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
}
.stat-box {
background: rgba(255,255,255,0.03);
border: 1px solid rgba(255,255,255,0.06);
border-radius: 8px;
padding: 12px;
text-align: center;
}
.stat-num {
font-family: "Orbitron",monospace;
font-size: 1.3rem;
font-weight: 900;
color: var(--gold);
display: block;
}
.stat-label {
font-size: 0.7rem;
color:var(--white);
margin-top: 2px;
}

.lang-list {
display: flex;
flex-direction: column;
gap: 10px;
}
.lang-item {
display: flex;
align-items: center;
gap: 8px;
}
.lang-name {
font-size: 0.82rem;
font-weight: 600;
min-width: 80px;
}
.lang-bar-wrap {
flex: 1;
height: 5px;
background: rgba(255,255,255,0.07);
border-radius: 3px;
overflow: hidden;
}
.lang-bar {
height: 100%;
border-radius: 3px;
background: linear-gradient(90deg,var(--blue),var(--gold));
}
.lang-pct {
font-size: 0.72rem;
color: var(--gray);
min-width: 30px;
text-align: right;
}


.tabs {
display: flex;
gap: 4px;
background: var(--card);
border: 1px solid rgba(255,255,255,0.07);
border-radius: 10px;
padding: 5px;
margin-bottom: 16px;
}
.tab {
flex: 1;
padding: 8px 12px;
border-radius: 7px;
border: none;
background: transparent;
color: var(--white);
font-family:sans-serif;
font-weight: 600;
font-size: 0.82rem;
cursor: pointer;
transition: all 0.2s;
text-align: center;
}
.tab.active {
background: rgba(245,168,0,0.12);
color: var(--gold);
border: 1px solid rgba(245,168,0,0.25);
}


.post-card {
background: var(--black);
border: 1px solid rgba(255,255,255,0.07);
border-radius: 10px;
padding: 16px;
margin-bottom: 12px;
cursor:none;
transition: all 0.2s;
}
.post-card:hover {
border-color: rgba(245,168,0,0.2);
transform: translateY(-2px);
}
.post-header {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 8px;
}
.post-type {
font-size: 0.65rem;
font-weight: 700;
padding: 2px 8px;
border-radius: 8px;
font-family: "Orbitron",monospace;
}
.post-type.tutorial {
background: rgba(245,168,0,0.12);
color: var(--gold);
border: 1px solid rgba(245,168,0,0.3);
}
.post-type.question {
background: rgba(26,111,232,0.12);
color: #7ab3ff;
border: 1px solid rgba(26,111,232,0.3);
}
.post-type.discussion {
background: rgba(168,85,247,0.12);
color: #c084fc;
border: 1px solid rgba(168,85,247,0.3);
}
.post-date {
font-size: 0.72rem;
color: var(--gray);
}
.post-title {
font-family: "Orbitron",monospace;
font-size: 0.88rem;
font-weight: 700;
margin-bottom: 6px;
line-height: 1.4;
}
.post-excerpt {
font-size: 0.8rem;
color: #E2E5E7;
line-height: 1.5;
margin-bottom: 10px;
display: -webkit-box;
-webkit-box-orient: vertical;
overflow: hidden;
}
.post-footer {
display: flex;
gap: 12px;
}
.post-stat {
font-size: 0.75rem;
color: var(--gray);
}

.badges-grid {
display: grid;
grid-template-columns: repeat(auto-fill,minmax(110px,1fr));
gap: 10px;
}
.badge-item {
background: rgba(255,255,255,0.03);
border: none;
border-radius: 10px;
padding: 14px;
text-align: center;
}
.badge-item.unlocked {
border-color: rgba(245,168,0,0.3);
background: rgba(245,168,0,0.05);
}
.badge-item.locked {
opacity: 0.35;
}
.badge-icon {
font-size: 1.8rem;
margin-bottom: 6px;
}
.badge-name {
font-family: "Orbitron",monospace;
font-size: 0.62rem;
font-weight: 700;
color: var(--gold);
}
.badge-item.locked .badge-name {
color: var(--gray);
}

.followers-info {
display: flex;
gap: 20px;
margin-top: 10px;
}
.follow-count {
font-size: 0.82rem;
color: var(--gray);
}
.follow-count strong {
color: var(--white);
font-weight: 700;
}

.spinner {
width: 30px;
height: 30px;
border: 3px solid rgba(245,168,0,0.2);
border-top-color: var(--gold);
border-radius: 50%;
animation: spin 0.8s linear infinite;
margin: 20px auto;
}
@keyframes spin {
to {
transform: rotate(360deg);
}
}
.empty-msg {
text-align: center;
padding: 30px;
color: var(--white);
font-size: 0.85rem;
}
.loading-full {
text-align: center;
padding: 80px 20px;
color: var(--white);
}

.toast {
position: fixed;
bottom: 24px;
left: 50%;
transform: translateX(-50%);
background: #1a1f2a;
border: 1px solid rgba(245,168,0,0.3);
color:var(--white);
padding: 12px 24px;
border-radius: 10px;
font-size: 0.88rem;
z-index: 999;
display: none;
animation: fadeIn 0.3s ease;
}
.toast.show {
display: block;
}
@keyframes fadeIn {
from {
opacity: 0;
transform: translateX(-50%) translateY(10px)
}

to {
opacity: 1;
transform: translateX(-50%) translateY(0)
}
}

@media(max-width:700px) {
.main-grid {
grid-template-columns: 1fr;
}
.nav-links {
display: none;
}
.profile-top {
flex-direction: column;
align-items: flex-start;
}
.profile-actions {
margin-left: 0;
width: 100%;
}
.btn-follow, .btn-message {
flex: 1;
justify-content: center;
}
}


.bottom-bar {
position: fixed;
bottom: 0;
left: 0;
width: 100%;
height: 72px;
background: rgba(10,10,10,0.9);
border:none;
display: flex;
justify-content: space-around;
align-items: center;
z-index: 999;
}

.bottom-item {
flex: 1;
text-decoration: none;
color:var(--white);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 5px;
font-size: .75rem;
transition: .3s;

}

.bottom-item i {
font-size: 1.2rem;
}

.bottom-item:hover,
.bottom-item.active {
color: var(--gold);
border-radius: 50px;
overflow: hidden;
}

@media(min-width:769px) {
.bottom-bar {
display: none;
}
}

</style>

<script type="module">
import {
getApps, getApp, initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
getAuth, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import "./onesignal-config.js";
import {
getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, where, getDocs, orderBy, arrayUnion, arrayRemove, increment
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = getApps().length ? getApp(): initializeApp({
apiKey: "AIzaSyBXDDwYx0FPnJBc6vkgLPzeIJk6hiEVMEw",
authDomain: "code-share-2c4ea.firebaseapp.com",
projectId: "code-share-2c4ea",
storageBucket: "code-share-2c4ea.firebasestorage.app",
messagingSenderId: "706094984093",
appId: "1:706094984093:web:bd62bbed06c156bb5c1d74"
});
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let targetUserId = null;
let targetData = null;
let isFollowing = false;


const params = new URLSearchParams(window.location.search);
targetUserId = params.get("uid");

if (!targetUserId) {
window.location.href = "community.html";
}


onAuthStateChanged(auth, async user => {

currentUser = user;


if (user) {

initOneSignal(user.uid);

try {
const ud = await getDoc(doc(db, "users", user.uid));
const navAvatar = document.getElementById("navAvatar");

if (ud.exists() && ud.data().photoBase64) {
navAvatar.innerHTML = `<img src="${ud.data().photoBase64}" alt="Avatar" />`;
} else {
navAvatar.textContent = (user.displayName || user.email).substring(0, 2).toUpperCase();
}
} catch (error) {
console.error("Erreur chargement avatar :", error);
}

if (user.uid === targetUserId) {
window.location.href = "profile.html";
return;
}
}

await loadUserProfile();
});

async function loadUserProfile() {
try {
const snap = await getDoc(doc(db, "users", targetUserId));
if (!snap.exists()) {
document.getElementById("mainContent").innerHTML = "<div class=\"loading-full\"><p style=\"color:var(--gray)\">Utilisateur introuvable.</p><button onclick=\"window.history.back()\" style=\"margin-top:16px;padding:10px 20px;background:var(--gold);color:var(--black);border:none;border-radius:8px;cursor:pointer;font-weight:700;\">Retour</button></div>";
return;
}

targetData = snap.data();


if (currentUser) {
isFollowing = (targetData.followedBy || []).includes(currentUser.uid);
}

renderProfile();
await loadUserPosts();
loadBadges();

} catch(e) {
document.getElementById("mainContent").innerHTML = "<div class=\"loading-full\"><p style=\"color:var(--gray)\">Erreur de chargement: "+e.message+"</p></div>";
}
}

function escapeHtml(text) {
return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderProfile() {
const name = (targetData.firstName || "")+" "+(targetData.lastName || "");
const username = targetData.username || "utilisateur";
const avHtml = targetData.photoBase64
? "<img src=\""+targetData.photoBase64+"\" alt=\"avatar\"/>": name.substring(0, 2).toUpperCase() || "?";

const followBtn = currentUser
? `<button class="btn-follow ${isFollowing?"following": ""}" id="followBtn" onclick="toggleFollow()">
${isFollowing ? "✓ Abonné": "+ S abonner"}
</button>`: `<button class="btn-follow" onclick="window.location.href='login.html'">+ S abonner</button>`;

const msgBtn = currentUser
? `<button class="btn-message" onclick="startMessage()"> Message</button>`: `<button class="btn-message" onclick="window.location.href='login.html'"> Message</button>`;

const langList = (targetData.languages || []).length > 0
? `<div class="card">
<div class="card-title">// Langages</div>
<div class="lang-list">
${(targetData.languages || []).slice(0, 5).map((l, i) => {
const pcts = [92, 80, 70, 60, 50];
return `<div class="lang-item">
<span class="lang-name">${l}</span>
<div class="lang-bar-wrap"><div class="lang-bar" style="width:${pcts[i] || 50}%"></div></div>
<span class="lang-pct">${pcts[i] || 50}%</span>
</div>`;
}).join("")}
</div>
</div>`: "";

document.getElementById("mainContent").innerHTML = `
<div class="profile-section">
<div class="profile-top">
<div>
<div class="avatar">${avHtml}</div>
<div class="avatar-badge">${targetData.role === "mentor"?"MENTOR": "APPRENANT"}</div>
</div>
<div class="profile-info">
<div class="profile-name">${escapeHtml(name.trim() || username)}</div>
<div class="profile-username">@${escapeHtml(username)} &middot; <span>Membre depuis ${formatDate(targetData.createdAt)}</span></div>
<div class="profile-tags">
<span class="tag ${targetData.role === "mentor"?"tag-mentor": "tag-apprenant"}">${targetData.role === "mentor"?"⭐ Mentor Expert": "🎓 Apprenant"}</span>
${(targetData.languages || []).slice(0, 3).map(l => `<span class="tag tag-lang">${escapeHtml(l)}</span>`).join("")}
</div>
<div class="followers-info">
<span class="follow-count"><strong id="followerCount">${targetData.followers || 0}</strong> abonnés</span>
<span class="follow-count"><strong>${targetData.points || 0}</strong> pts</span>
</div>
</div>
<div class="profile-actions">
${followBtn}
${msgBtn}
</div>
</div>

<div class="main-grid">
<div>
<div class="card">
<div class="card-title">// À Propos</div>
<p class="bio-text">${escapeHtml(targetData.bio || "Pas encore de biographie.")}</p>
</div>
<div class="card">
<div class="card-title">// Statistiques</div>
<div class="stats-grid">
<div class="stat-box"><span class="stat-num" id="statPosts">...</span><span class="stat-label">Publications</span></div>
<div class="stat-box"><span class="stat-num">${targetData.answers || 0}</span><span class="stat-label">Réponses</span></div>
<div class="stat-box"><span class="stat-num">${targetData.points || 0}</span><span class="stat-label">Points</span></div>
<div class="stat-box"><span class="stat-num">${targetData.followers || 0}</span><span class="stat-label">Abonnés</span></div>
</div>
</div>
${langList}
</div>

<div>
<div class="tabs">
<button class="tab active" onclick="switchTab('publications',this)">Publications</button>
<button class="tab" onclick="switchTab('badges',this)"> Badges</button>
</div>
<div id="tab-publications"><div class="spinner"></div></div>
<div id="tab-badges" style="display:none"></div>
</div>
</div>
</div>`;
}


async function loadUserPosts() {
const container = document.getElementById("tab-publications");
if (!container) return;
try {
const snap = await getDocs(query(collection(db, "posts"), where("userId", "==", targetUserId), orderBy("createdAt", "desc")));
const el = document.getElementById("statPosts");
if (el) el.textContent = snap.size;

if (snap.empty) {
container.innerHTML = "<div class=\"empty-msg\">Aucune publication pour l instant.</div>";
return;
}
const labelMap = {
question: "QUESTION",
tutorial: "TUTORIEL",
discussion: "DISCUSSION"
};
container.innerHTML = snap.docs.map(d => {
const p = d.data();
const date = p.createdAt?.toDate ? timeAgo(p.createdAt.toDate()): "récemment";
const t = p.type || "question";
return `<div class="post-card" onclick="window.location.href='community.html'">
<div class="post-header">
<span class="post-type ${t}">${labelMap[t] || "POST"}</span>
<span class="post-date">${date}</span>
</div>
<div class="post-title">${escapeHtml(p.title)}</div>
<div class="post-excerpt">${escapeHtml(p.content)}</div>
<div class="post-footer">
<span class="post-stat">❤️ ${p.votes || 0}</span>
<span class="post-stat">💬 ${p.comments || 0}</span>
</div>
</div>`;
}).join("");
} catch(e) {
if (container) container.innerHTML = "<div class=\"empty-msg\">Erreur de chargement.</div>";
}
}

function loadBadges() {
const container = document.getElementById("tab-badges");
if (!container) return;
const BADGES = [{
id: "newcomer",
icon: "",
name: "NOUVEAU",
req: () => true
},
{
id: "first_post",
icon: "",
name: "1ER POST",
req: () => (targetData.tutorials || 0) >= 1
},
{
id: "helper",
icon: "",
name: "HELPER",
req: () => (targetData.answers || 0) >= 5
},
{
id: "rising",
icon: "",
name: "ÉTOILE",
req: () => (targetData.points || 0) >= 100
},
{
id: "mentor",
icon: "",
name: "MENTOR",
req: () => (targetData.points || 0) >= 500
},
{
id: "top",
icon: "",
name: "TOP MENTOR",
req: () => (targetData.points || 0) >= 1000
},
{
id: "verified",
icon: "",
name: "VÉRIFIÉ",
req: () => !!(targetData.bio && targetData.username)
},
{
id: "pro",
icon: "",
name: "PRO",
req: () => (targetData.tutorials || 0) >= 5
},
];
const earned = targetData.badges || [];
container.innerHTML = "<div class=\"badges-grid\">" + BADGES.map(b => {
const unlocked = earned.includes(b.id) || b.req();
return `<div class="badge-item ${unlocked?"unlocked": "locked"}">
<div class="badge-icon">${b.icon}</div>
<div class="badge-name">${b.name}</div>
</div>`;
}).join("") + "</div>";
}

window.toggleFollow = async function() {
if (!currentUser) {
window.location.href = "login.html"; return;
}
const btn = document.getElementById("followBtn");
btn.disabled = true;

try {
const targetRef = doc(db, "users", targetUserId);
const currentRef = doc(db, "users", currentUser.uid);

if (isFollowing) {

await updateDoc(targetRef, {
followedBy: arrayRemove(currentUser.uid), followers: increment(-1)
});
await updateDoc(currentRef, {
following: arrayRemove(targetUserId)
});
isFollowing = false;
btn.className = "btn-follow";
btn.textContent = "+ S abonner";
const fc = document.getElementById("followerCount");
if (fc) fc.textContent = Math.max(0, parseInt(fc.textContent) - 1);
showToast("Abonnement annulé");
} else {

await setDoc(targetRef, {
followedBy: arrayUnion(currentUser.uid), followers: increment(1)
}, {
merge: true
});
await setDoc(currentRef, {
following: arrayUnion(targetUserId)
}, {
merge: true
});

try {
const myData = await getDoc(currentRef);
const myInfo = myData.exists() ? myData.data(): {};
await setDoc(doc(collection(db, "users", targetUserId, "notifications")), {
type: "follow",
senderName: myInfo.username || currentUser.email.split("@")[0],
senderPhoto: myInfo.photoBase64 || null,
message: "s est abonné à ton profil",
read: false,
createdAt: new Date()
});
} catch(e) {}

isFollowing = true;
btn.className = "btn-follow following";
btn.textContent = "✓ Abonné";
const fc = document.getElementById("followerCount");
if (fc) fc.textContent = parseInt(fc.textContent) + 1;
showToast(" Abonnement confirmé !");
}
} catch(e) {
showToast("Erreur: "+e.message);
}
btn.disabled = false;
};


window.startMessage = async function() {
if (!currentUser) {
window.location.href = "login.html"; return;
}

try {

const q = query(collection(db, "conversations"), where("members", "array-contains", currentUser.uid));
const snap = await getDocs(q);
let existingId = null;
snap.forEach(d => {
if (d.data().members.includes(targetUserId)) existingId = d.id;
});

if (!existingId) {

const convRef = doc(collection(db, "conversations"));
await setDoc(convRef, {
members: [currentUser.uid, targetUserId],
createdAt: new Date(),
lastMessageAt: new Date(),
lastMessage: "",
unreadBy: []
});
existingId = convRef.id;
}

window.location.href = "messages.html?conv="+existingId;
} catch(e) {
showToast("Erreur: "+e.message);
}
};

window.switchTab = function(tab, el) {
document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
el.classList.add("active");
["publications",
"badges"].forEach(t => {
const el2 = document.getElementById("tab-"+t);
if (el2) el2.style.display = t === tab ? "block": "none";
});
};

function showToast(msg) {
const t = document.getElementById("toast");
t.textContent = msg;
t.classList.add("show");
setTimeout(() => t.classList.remove("show"),
3000);
}

function formatDate(str) {
if (!str) return "2026";
try {
return new Date(str).toLocaleDateString("fr-FR", {
month: "long", year: "numeric"
});
}
catch(e) {
return "2026";
}
}

function timeAgo(date) {
const d = Math.floor((Date.now()-date)/1000);
if (d < 60) return "à l instant";
if (d < 3600) return "Il y a "+Math.floor(d/60)+"min";
if (d < 86400) return "Il y a "+Math.floor(d/3600)+"h";
return "Il y a "+Math.floor(d/86400)+" jour(s)";
}
