<style>
:root {
--gold: #F5A800;
--blue: #1A6FE8;
--black: #0A0A0A;
--card: #16191F;
--white: #FFFFFF;
--gray: #8892A4;
}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
background: var(--black);
color:var(--white);
font-family: sans-serif;
min-height: 100vh;
}
body::before {
content: "";
position: fixed;
inset: 0;
background-size: 60px 60px;
pointer-events: none;
z-index: 0;
}

nav {
position: sticky;
top: 0;
z-index: 100;
display: flex;
align-items: center;
justify-content: space-between;
padding: 14px 20px;
background: rgba(10,10,10,0.95);
backdrop-filter: blur(12px);
border-bottom: 1px solid rgba(245,168,0,0.15);
}
.nav-logo {
display: flex;
align-items: center;
gap: 10px;
cursor:none;
}
.nav-logo img {
width: 40px;
height: 40px;
object-fit: contain;
border-radius: 50%;
}
.logo-text {
font-family: "Orbitron",monospace;
font-size: 1rem;
font-weight: 700;
color:var(--white);
}
.logo-text .b {
color: var(--blue);
}

.logo-text .g {
color: var(--gold);
}
.nav-links {
display: flex;
gap: 20px;
}
.nav-links a {
color: var(--gray);
text-decoration: none;
font-size: 0.82rem;
font-weight: 600;
cursor: none;
transition: color 0.2s;
}
.nav-links a:hover, .nav-links a.active {
color: var(--gold);
}
.nav-avatar {
width: 36px;
height: 36px;
border-radius: 50%;
background:var(--blue);
display: flex;
align-items: center;
justify-content: center;
font-weight: 700;
font-size: 0.8rem;
cursor:none;
border: 1px solid rgba(245,168,0,0.4);
overflow: hidden;
}
.nav-avatar img {
width: 100%;
height: 100%;
object-fit: cover;
border-radius: 50%;
}

.page-header {
position: relative;
z-index: 1;
padding: 28px 20px 22px;
text-align: center;
background: var(--black)
}
.page-header h1 {
font-family: "Orbitron",monospace;
font-size: 1.6rem;
font-weight: 900;
margin-bottom: 8px
}
.page-header h1 span {
color: var(--gold);
}
.page-header p {
color:var(--white);;
font-size: 0.88rem;
margin-bottom: 20px;
}
.search-bar {
display: flex;
gap: 10px;
max-width: 520px;
margin: 0 auto;
}
.search-wrap {
flex: 1;
position: relative;
}
.search-wrap i {
position: absolute;
left: 14px;
top: 50%;
transform: translateY(-50%);
color: var(--gray);
}
.search-wrap input {
width: 100%;
background: var(--card);
border: 1.5px solid rgba(255,255,255,0.1);
border-radius: 10px;
padding: 12px 14px 12px 40px;
color:#E2E5E7;
font-family:sans-serif;
font-size: 0.9rem;
outline: none;
transition: border-color 0.2s;
}
.search-wrap input:focus {
border-color: var(--gold);
}
.search-wrap input::placeholder {
color: rgba(255,255,255,0.2);
}

.filter-tabs {
position: relative;
z-index: 1;
padding: 14px 20px;
display: flex;
gap: 8px;
justify-content: center;
flex-wrap: wrap;
}
.tab-btn {
padding: 7px 16px;
border-radius: 20px;
border: 1.5px solid rgba(255,255,255,0.1);
background: transparent;
color: var(--gray);
font-size: 0.8rem;
font-weight: 600;
cursor:none;
transition: all 0.2s;
display: flex;
align-items: center;
gap: 6px;
}
.tab-btn.active {
background: rgba(245,168,0,0.1);
border-color: var(--gold);
color: var(--gold);
}

.main {
position: relative;
z-index: 1;
max-width: 760px;
margin: 0 auto;
padding: 24px 16px 60px;
}

.member-grid {
display: flex;
flex-direction: column;
gap:10px;
}
.member-card {
display: flex;
align-items: center;
gap: 14px;
padding: 16px;
background: var(--black);
border:none;
border-radius: 12px;
transition: all 0.2s;
}
.member-card:hover {
border-color: rgba(245,168,0,0.2);
}
.member-avatar {
width: 52px;
height: 52px;
border-radius: 50%;
background:var(--blue);
display: flex;
align-items: center;
justify-content: center;
font-weight: 700;
font-size: 1rem;
flex-shrink: 0;
overflow: hidden;
cursor: none;
}
.member-avatar img {
width: 100%;
height: 100%;
object-fit: cover;
border-radius: 50%;
}
.member-info {
flex: 1;
min-width: 0;
cursor: none;
}
.member-name {
font-weight: 700;
font-size: 0.92rem;
margin-bottom: 1px;
}
.member-username {
font-size: 0.78rem;
color: var(--blue);
margin-bottom: 5px;
}
.member-bio {
font-size: 0.78rem;
color:var(--white);
display: -webkit-box;
-webkit-box-orient: vertical;
overflow: hidden;
margin-bottom: 5px;
}
.member-meta {
display: flex;
gap: 10px;
align-items: center;
flex-wrap: wrap;
}
.member-role-tag {
font-size: 0.66rem;
font-weight: 700;
padding: 2px 8px;
border-radius: 8px;
font-family: "Orbitron",monospace;
}
.role-mentor {
background: rgba(245,168,0,0.12);
color: var(--gold);
border: 1px solid rgba(245,168,0,0.3);
}
.role-apprenant {
background: rgba(26,111,232,0.12);
color: #7ab3ff;
border: 1px solid rgba(26,111,232,0.3);
}
.member-pts {
font-size: 0.72rem;
color: var(--gray);
}
.member-pts i {
color: var(--gold);
}
.member-followers {
font-size: 0.72rem;
color: var(--gray);
}

.btn-follow-small {
padding: 8px 16px;
border-radius: 8px;
border: 1.5px solid var(--gold);
background: linear-gradient(135deg,var(--gold),#e09500);
color: var(--black);
font-family: sans-serif;
font-weight: 700;
font-size: 0.8rem;
cursor:none;
transition: all 0.2s;
flex-shrink: 0;
display: flex;
align-items: center;
gap: 6px;
white-space: nowrap;
}
.btn-follow-small:hover {
transform: translateY(-1px);
box-shadow: 0 6px 16px rgba(245,168,0,0.3);
}
.btn-follow-small.following {
background: transparent;
border-color: rgba(255,255,255,0.15);
color: var(--gray);
}
.btn-follow-small.following:hover {
border-color: #ff4d4d;
color: #ff4d4d;
background: rgba(255,77,77,0.08);
}

.spinner {
width: 32px;
height: 32px;
border: 3px solid rgba(245,168,0,0.2);
border-top-color: var(--gold);
border-radius: 50%;
animation: spin 0.8s linear infinite;
margin: 0 auto 14px;
}
@keyframes spin {
to {
transform: rotate(360deg);
}
}
.empty-state {
text-align: center;
padding: 60px 20px;
color: var(--gray);
}
.empty-icon {
font-size: 2.8rem;
margin-bottom: 12px;
color: var(--gold);
opacity: 0.4;
}

.toast {
position: fixed;
bottom: 24px;
left: 50%;
transform: translateX(-50%) translateY(20px);
background: #1a1f2a;
border: 1px solid rgba(245,168,0,0.3);
color: var(--white);
padding: 12px 24px;
border-radius: 10px;
font-size: 0.88rem;
z-index: 999;
opacity: 0;
transition: all 0.3s;
display: flex;
align-items: center;
gap: 8px;
}
.toast.show {
opacity: 1;
transform: translateX(-50%) translateY(0);
}
.toast i {
color: var(--gold);
}

@media(max-width:600px) {
.nav-links {
display: none;
}
.member-card {
flex-wrap: wrap;
}
.btn-follow-small {
margin-left: auto;
}
}


.bottom-bar {
position: fixed;
bottom: 0;
left: 0;
width: 100%;
height: 72px;
background: rgba(10,10,10,0.9);
display: flex;
justify-content: space-around;
align-items: center;
z-index: 999;
}

.bottom-item {
flex: 1;
text-decoration: none;
color:var(--white);
font-weight:700px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 5px;
font-size: .75rem;
transition: .3s;

}

.bottom-item i {
font-size: 1.2rem;
}

.bottom-item:hover,
.bottom-item.active {
color: var(--gold);
border-radius: 50px;
overflow: hidden;
}

@media(min-width:769px) {
.bottom-bar {
display: none;
}
}

</style>

"discover.noBio": "Pas encore de biographie",
"discover.roleMentor": "Mentor",
"discover.roleLearner": "Apprenant",
"discover.member": "Membre",
"discover.defaultUsername": "membre",
"discover.pts": "pts",
"discover.followers": "abonnés",
"discover.following": "Abonné",
"discover.follow": "Suivre",
"discover.toast.unfollowed": "Abonnement annulé",
"discover.toast.followed": "Abonnement confirmé !",
"discover.toast.error": "Erreur :",
};
function t(key) {
if (typeof window.t === "function") {
try {
return window.t(key);
} catch (e) {}
}
return DISCOVER_FALLBACK_FR[key] || key;
}

let currentUser = null;
let myData = {};
let allUsers = [];
let currentFilter = "all";

onAuthStateChanged(auth, async user => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    currentUser = user;


    initOneSignal(user.uid);

    try {
        const ud = await getDoc(doc(db, "users", user.uid));
        myData = ud.exists() ? ud.data() : {};
        const navAv = document.getElementById("navAvatar");

        if (myData.photoBase64) {
            navAv.innerHTML = `<img src="${myData.photoBase64}" alt="Avatar" />`;
        } else {
            navAv.textContent = (user.displayName || user.email).substring(0, 2).toUpperCase();
        }
    } catch (error) {
        console.error("Erreur chargement profil :", error);
    }

    loadMembers();
});

function escapeHtml(text) {
return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

async function loadMembers() {
try {
const snap = await getDocs(collection(db, "users"));
allUsers = snap.docs
.map(d => ({
id: d.id, ...d.data()
}))
.filter(u => u.id !== currentUser.uid);
allUsers.sort((a, b) => (b.points || 0) - (a.points || 0));
renderMembers();
} catch(e) {
document.getElementById("memberContainer").innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="fa-solid fa-triangle-exclamation"></i></div><p>'+t("discover.error")+' '+e.message+'</p></div>';
}
}

window.renderMembers = function() {
const container = document.getElementById("memberContainer");
const search = document.getElementById("searchInput").value.toLowerCase();
let users = [...allUsers];

const myFollowing = myData.following || [];

if (currentFilter === "mentor") users = users.filter(u => u.role === "mentor");
else if (currentFilter === "apprenant") users = users.filter(u => u.role !== "mentor");
else if (currentFilter === "notfollowing") users = users.filter(u => !myFollowing.includes(u.id));

if (search) {
users = users.filter(u =>
(u.username || "").toLowerCase().includes(search) ||
(u.firstName || "").toLowerCase().includes(search) ||
(u.lastName || "").toLowerCase().includes(search) ||
(u.languages || []).some(l => l.toLowerCase().includes(search))
);
}

if (users.length === 0) {
container.innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="fa-solid fa-user-slash"></i></div><p>'+t("discover.empty")+'</p></div>';
return;
}

container.innerHTML = '<div class="member-grid">' + users.map(u => {
const name = u.firstName ? u.firstName+" "+u.lastName: u.username || t("discover.member");
const avHtml = u.photoBase64 ? "<img src=\""+u.photoBase64+"\"/>": name.substring(0, 2).toUpperCase();
const isFollowing = myFollowing.includes(u.id);
const roleTag = u.role === "mentor"
? '<span class="member-role-tag role-mentor"><i class="fa-solid fa-star"></i> '+t("discover.roleMentor")+'</span>': '<span class="member-role-tag role-apprenant"><i class="fa-solid fa-graduation-cap"></i> '+t("discover.roleLearner")+'</span>';
return `<div class="member-card">
<div class="member-avatar" onclick="window.location.href='user-profile.html?uid=${u.id}'">${avHtml}</div>
<div class="member-info" onclick="window.location.href='user-profile.html?uid=${u.id}'">
<div class="member-name">${escapeHtml(name)}</div>
<div class="member-username">@${escapeHtml(u.username || t("discover.defaultUsername"))}</div>
<div class="member-bio">${escapeHtml(u.bio || t("discover.noBio"))}</div>
<div class="member-meta">
${roleTag}
<span class="member-pts"><i class="fa-solid fa-bolt"></i> ${u.points || 0} ${t("discover.pts")}</span>
<span class="member-followers"><i class="fa-solid fa-users"></i> ${u.followers || 0} ${t("discover.followers")}</span>
</div>
</div>
<button class="btn-follow-small ${isFollowing?"following": ""}" onclick="toggleFollow('${u.id}',this)">
<i class="fa-solid ${isFollowing?"fa-user-check": "fa-user-plus"}"></i> ${isFollowing?t("discover.following"): t("discover.follow")}
</button>
</div>`;
}).join("") + "</div>";
};

window.toggleFollow = async function(targetId, btn) {
btn.disabled = true;
try {
const targetRef = doc(db, "users", targetId);
const currentRef = doc(db, "users", currentUser.uid);
const myFollowing = myData.following || [];
const isFollowing = myFollowing.includes(targetId);

if (isFollowing) {
await updateDoc(targetRef, {
followedBy: arrayRemove(currentUser.uid), followers: increment(-1)
});
await updateDoc(currentRef, {
following: arrayRemove(targetId)
});
myData.following = myFollowing.filter(id => id !== targetId);
btn.classList.remove("following");
btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> '+t("discover.follow");
showToast(t("discover.toast.unfollowed"));
} else {
await setDoc(targetRef, {
followedBy: arrayUnion(currentUser.uid), followers: increment(1)
}, {
merge: true
});
await setDoc(currentRef, {
following: arrayUnion(targetId)
}, {
merge: true
});
myData.following = [...myFollowing,
targetId];
btn.classList.add("following");
btn.innerHTML = '<i class="fa-solid fa-user-check"></i> '+t("discover.following");
showToast(t("discover.toast.followed"));

try {
await addDoc(collection(db, "users", targetId, "notifications"), {
type: "follow",
senderName: myData.username || currentUser.email.split("@")[0],
senderPhoto: myData.photoBase64 || null,
message: "s est abonné à ton profil",
link: "user-profile.html?uid="+currentUser.uid,
read: false,
createdAt: serverTimestamp()
});
sendOneSignalNotification(
targetId,
myData.username || currentUser.email.split("@")[0],
"s'est abonné à ton profil",
"user-profile.html?uid=" + currentUser.uid
);
} catch(e) {}
}
} catch(e) {
showToast(t("discover.toast.error")+" "+e.message);
}
btn.disabled = false;
};

window.setFilter = function(filter, el) {
currentFilter = filter;
document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
el.classList.add("active");
renderMembers();
};

function showToast(msg) {
const t = document.getElementById("toast");
document.getElementById("toastMsg").textContent = msg;
t.classList.add("show");
setTimeout(() => t.classList.remove("show"), 2500);
}
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js')
    .then(reg => console.log('Service Worker enregistré:', reg.scope))
    .catch(err => console.log('Erreur Service Worker:', err));
}
</script>
