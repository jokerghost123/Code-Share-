<style>
:root {
--gold: #F5A800;
--blue: #1A6FE8;
--black: #0A0A0A;
--card: #16191F;
--white: #FFFFFF;

}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
background: var(--black);
color:var(--white);
font-family: sans-serif;
min-height: 100vh;
}
body::before {

}

nav {

.nav-logo {

}

}
.logo-text {

}
.logo-text .b {

}

}
.nav-links {

}

.nav-right {

}

height: 100%;

}
.btn-write {
padding: 8px 16px;
background: var(--blue);
color:var(--white);

font-weight: 700;

transition: all 0.2s;
}
.btn-write:hover {

}

.search-row {

gap: 10px;

}
.search-wrap {

}
.search-wrap span {

}

left: 12px;
top: 50%;

}
.search-wrap input {

}

}

.main {

z-index: 1;

margin: 0 auto;
padding: 24px 16px 60px;
}

.list-view {
display: block;
}
.list-view.hidden {
display: none;
}
.detail-view {
display: none;
}
.detail-view.active {

}

.tut-grid {
display: grid;
grid-template-columns: repeat(auto-fill,minmax(260px,1fr));

}
.tut-card {

}
.tut-thumb-js {

}
.tut-thumb-py {

}
.tut-thumb-css {

}
.level-intermediaire {

.tut-stat {
font-size: 0.72rem;
color:;

}

border: 1px solid rgba(255,255,255,0.07);

}

}
.tut-detail-body {

}
.tut-detail-meta {

align-items: center;
gap: 10px;
margin-bottom: 12px;

}
.tut-detail-title {

}
.tut-detail-content {

line-height: 1.8;

}
.tut-detail-tags {
display: flex;
gap: 6px;
flex-wrap: wrap;
margin-bottom: 18px;
}
.detail-tag {
font-size: 0.72rem;
padding: 3px 10px;

background: rgba(26,111,232,0.08);
color: #7ab3ff;
border: 1px solid rgba(26,111,232,0.15);
}
.tut-detail-footer {
display: flex;

padding-top: 16px;

.btn-like {

.comments-wrap {

.comments-title {

.comment-list {

}
.comment-item {

.comment-av {

.comment-av img {

}

}
.comment-role {

}
.comment-time {

.comment-text {

.comment-input-row {

}

}
.comment-textarea:focus {

}
.comment-textarea::placeholder {
color: rgba(255,255,255,0.2);
}
.btn-comment {
padding: 9px 20px;
background: linear-gradient(135deg,var(--gold),#e09500);
color: var(--black);
border: none;
border-radius: 8px;
font-family: "Orbitron",monospace;
font-weight: 700;
font-size: 0.8rem;

transition: all 0.2s;
}
.btn-comment:hover {
transform: translateY(-2px);

}
.btn-comment:disabled {

}
.login-notice {

padding: 14px;
background: rgba(26,111,232,0.06);
border: 1px solid rgba(26,111,232,0.15);
border-radius: 8px;
font-size: 0.85rem;
color: var(--gray);
}
.login-notice a {
color: var(--gold);
font-weight: 600;
text-decoration: none;
}

.modal-overlay {
display: none;

background: rgba(0,0,0,0.78);
z-index: 200;
align-items: center;
justify-content: center;
padding: 16px;
}
.modal-overlay.open {
display: flex;
}
.modal {

}
.modal-title {

}
.modal-close {

}
.modal-label {
display: block;

color: var(--gray);
font-weight: 600;
margin-bottom: 7px;
}
.modal-input, .modal-select, .modal-textarea {
width: 100%;
background: rgba(255,255,255,0.05);
border: 1.5px solid rgba(255,255,255,0.1);
border-radius: 8px;
padding: 10px 12px;

font-size: 0.88rem;

margin-bottom: 14px;
}
.modal-textarea {

}
.modal-input:focus, .modal-select:focus, .modal-textarea:focus {

}
.modal-tag {

.modal-tag.selected {

.btn-publish {

background: linear-gradient(135deg,var(--gold),#e09500);
color: var(--black);

}

}

}

.spinner {

}

}

.empty-state {

@media(max-width:600px) {

}

}
}


.bottom-bar {

.bottom-item {

.bottom-item:hover,

}

<p>
Apprends avec les meilleurs tutoriels rédigés par la communauté

<input type="text" id="searchInput" placeholder="Rechercher un tutoriel..." oninput="filterTutorials()" />
</div>

<button class="pill active" onclick="setLevel('all',this)"> Tous</button>
<button class="pill" onclick="setLevel('debutant',this)"><i class="#" style="color:#28C840;"></i> Débutant</button>
<button class="pill" onclick="setLevel('intermediaire',this)"><i class="#" style="color:#F5A800;"></i> Intermédiaire</button>

<div class="modal">
<div class="modal-title">

</div>
<label class="modal-label">Titre *</label>
<input class="modal-input" type="text" id="tutTitle" placeholder="Ex: Apprendre Flexbox CSS en 10 minutes" />
<label class="modal-label">Niveau *</label>
<select class="modal-select" id="tutLevel">
<option value="debutant">Débutant</option>
<option value="intermediaire">Intermédiaire</option>

</select>

<label class="modal-label">Tags (clique pour sélectionner)</label>
<div class="modal-tags-wrap">
<span class="modal-tag" onclick="this.classList.toggle('selected')">JavaScript</span>
<span class="modal-tag" onclick="this.classList.toggle('selected')">Python</span>
<span class="modal-tag" onclick="this.classList.toggle('selected')">HTML/CSS</span>
<span class="modal-tag" onclick="this.classList.toggle('selected')">React</span>
<span class="modal-tag" onclick="this.classList.toggle('selected')">Node.js</span>
<span class="modal-tag" onclick="this.classList.toggle('selected')">Git</span>
<span class="modal-tag" onclick="this.classList.toggle('selected')">PHP</span>
<span class="modal-tag" onclick="this.classList.toggle('selected')">Java</span>
<span class="modal-tag" onclick="this.classList.toggle('selected')">TypeScript</span>
<span class="modal-tag" onclick="this.classList.toggle('selected')">Firebase</span>
</div>

</div>

<script type="module">

import {
getApps, getApp, initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
getAuth, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import "./onesignal-config.js";
import {
getFirestore, collection, addDoc, doc, getDoc, setDoc, updateDoc, getDocs,
query, where, orderBy, onSnapshot, increment, arrayUnion, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = getApps().length ? getApp() : initializeApp({
apiKey: "AIzaSyBXDDwYx0FPnJBc6vkgLPzeIJk6hiEVMEw",
authDomain: "code-share-2c4ea.firebaseapp.com",
projectId: "code-share-2c4ea",
storageBucket: "code-share-2c4ea.firebasestorage.app",
messagingSenderId: "706094984093",
appId: "1:706094984093:web:bd62bbed06c156bb5c1d74"
});

const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let myData = {};
let allTuts = [];
let currentLevel = "all";
let activeTutId = null;
let unsubComments = null;


const thumbClass = t => {
const tags = (t.tags || []).map(x => x.toLowerCase()).join(" ");
if (tags.includes("javascript") || tags.includes("js")) return "tut-thumb-js";
if (tags.includes("python")) return "tut-thumb-py";
if (tags.includes("css") || tags.includes("html")) return "tut-thumb-css";
if (tags.includes("react")) return "tut-thumb-react";
if (tags.includes("node")) return "tut-thumb-node";
return "tut-thumb-default";
};

const thumbEmoji = t => {
const tags = (t.tags || []).map(x => x.toLowerCase()).join(" ");
if (tags.includes("javascript")) return '<i class="fa-brands fa-square-js"></i>';
if (tags.includes("python")) return '<i class="fa-brands fa-python"></i>';
if (tags.includes("css")) return '<i class="fa-brands fa-css3-alt"></i>';
if (tags.includes("html")) return '<i class="fa-brands fa-html5"></i>';
if (tags.includes("react")) return '<i class="fa-brands fa-react"></i>';
if (tags.includes("node")) return '<i class="fa-brands fa-node-js"></i>';
if (tags.includes("git")) return '<i class="fa-brands fa-git-alt"></i>';
if (tags.includes("php")) return '<i class="fa-brands fa-php"></i>';
if (tags.includes("java")) return '<i class="fa-brands fa-java"></i>';
return '<i class="fa-solid fa-book-open"></i>';
};


onAuthStateChanged(auth, async user => {

    currentUser = user;
    const navAv = document.getElementById("navAvatar");

    if (user) {

        initOneSignal(user.uid);


        try {
            const ud = await getDoc(doc(db, "users", user.uid));
            myData = ud.exists() ? ud.data() : {};


            if (myData.photoBase64) {
                navAv.innerHTML = `<img src="${myData.photoBase64}" alt="Avatar" />`;
            } else {
                navAv.textContent = (user.displayName || user.email).substring(0, 2).toUpperCase();
            }
        } catch (error) {
            console.error("Erreur chargement profil :", error);
            navAv.textContent = (user.displayName || user.email).substring(0, 2).toUpperCase();
        }

    } else {

        navAv.textContent = "?";

    }
});



const qTutos = query(collection(db, "posts"), where("type", "==", "tutorial"));

onSnapshot(qTutos, snap => {

    allTuts = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    allTuts.sort((a, b) => {
        const ta = a.createdAt?.toDate ? a.createdAt.toDate().getTime() : 0;
        const tb = b.createdAt?.toDate ? b.createdAt.toDate().getTime() : 0;
        return tb - ta;
    });
    renderTutorials();
});

window.renderTutorials = function() {
const grid = document.getElementById("tutGrid");
let tuts = [...allTuts];
const search = document.getElementById("searchInput").value.toLowerCase();


if (currentLevel !== "all") tuts = tuts.filter(t => t.level === currentLevel);

if (search) tuts = tuts.filter(t =>
t.title?.toLowerCase().includes(search) ||
t.content?.toLowerCase().includes(search) ||
(t.tags || []).some(tag => tag.toLowerCase().includes(search))
);

if (tuts.length === 0) {
grid.innerHTML = "<div class=\"empty-state\" style=\"grid-column:1/-1\"><div class=\"empty-icon\"><i class=\"fa-solid fa-inbox\"></i></div><p>Aucun tutoriel pour l\'instant.<br/>Sois le premier à en publier !</p></div>";
return;
}

const levelLabel = {
debutant: "DÉBUTANT",
intermediaire: "INTERMÉDIAIRE",
avance: "AVANCÉ"
};
const levelClass = {
debutant: "level-debutant",
intermediaire: "level-intermediaire",
avance: "level-avance"
};

grid.innerHTML = tuts.map(t => {
const date = t.createdAt?.toDate ? timeAgo(t.createdAt.toDate()): "récemment";
const lvl = t.level || "debutant";
const avHtml = t.authorPhoto ? "<img src=\""+t.authorPhoto+"\"/>": (t.username || "?").substring(0, 2).toUpperCase();
const tags = (t.tags || []).slice(0, 2).map(tag => `<span class="detail-tag">${escapeHtml(tag)}</span>`).join("");
return `<div class="tut-card" onclick="openTutorial('${t.id}')">
<div class="tut-thumb ${thumbClass(t)}">
<div class="tut-thumb-glow"></div>
<span>${thumbEmoji(t)}</span>
</div>
<div class="tut-body">
<div class="tut-head">
<span class="level-tag ${levelClass[lvl] || "level-debutant"}">${levelLabel[lvl] || "DÉBUTANT"}</span>
</div>
<div class="tut-title">${escapeHtml(t.title)}</div>
<div class="tut-desc">${escapeHtml(t.content)}</div>
<div class="tut-footer">
<div class="tut-author">
<div class="tut-author-av">${avHtml}</div>
@${escapeHtml(t.username || "anonyme")}
</div>
<div class="tut-stats">
<span class="tut-stat"><i class="fa-solid fa-heart"></i> ${t.votes || 0}</span>
<span class="tut-stat"><i class="fa-solid fa-comment"></i> ${t.comments || 0}</span>
</div>
</div>
</div>
</div>`;
}).join("");
};

window.openTutorial = async function(tutId) {
activeTutId = tutId;
document.getElementById("listView").classList.add("hidden");
document.getElementById("detailView").classList.add("active");

const snap = await getDoc(doc(db, "posts", tutId));
if (!snap.exists()) return;
const t = snap.data();
const date = t.createdAt?.toDate ? t.createdAt.toDate().toLocaleDateString("fr-FR", {
day: "numeric", month: "long", year: "numeric"
}): "récemment";
const lvl = t.level || "debutant";
const levelLabel = {
debutant: "DÉBUTANT",
intermediaire: "INTERMÉDIAIRE",
avance: "AVANCÉ"
};
const levelClass = {
debutant: "level-debutant",
intermediaire: "level-intermediaire",
avance: "level-avance"
};
const avHtml = t.authorPhoto ? "<img src=\""+t.authorPhoto+"\"/>": (t.username || "?").substring(0, 2).toUpperCase();
const tags = (t.tags || []).map(tag => `<span class="detail-tag">${escapeHtml(tag)}</span>`).join("");
const isLiked = currentUser && (t.votedBy || []).includes(currentUser.uid);

document.getElementById("detailContent").innerHTML = `
<div class="tut-detail-card">
<div class="tut-detail-banner ${thumbClass(t)}">
<div class="tut-thumb-glow"></div>
<span style="font-size:4rem;">${thumbEmoji(t)}</span>
</div>
<div class="tut-detail-body">
<div class="tut-detail-meta">
<span class="level-tag ${levelClass[lvl] || "level-debutant"}">${levelLabel[lvl] || "DÉBUTANT"}</span>
<span style="font-size:0.75rem;color:var(--gray);"><i class="fa-regular fa-calendar"></i> ${date}</span>
</div>
<div class="tut-detail-title">${escapeHtml(t.title)}</div>
<div class="tut-detail-content">${escapeHtml(t.content)}</div>
<div class="tut-detail-tags">${tags}</div>
<div class="tut-detail-footer">
<button class="btn-like ${isLiked?"liked": ""}" id="likeBtn" onclick="likeTutorial('${tutId}')">
<i class="fa-solid fa-heart"></i> <span class="like-count" id="likeCount">${t.votes || 0}</span> J'aime
</button>
<div class="detail-author" onclick="window.location.href='user-profile.html?uid=${t.userId}'">
<div class="detail-author-av">${avHtml}</div>
<div>
<div class="detail-author-name">@${escapeHtml(t.username || "anonyme")}</div>
<div class="detail-author-role">${t.authorRole === "mentor"?'<i class="fa-solid fa-star"></i> Mentor': '<i class="fa-solid fa-graduation-cap"></i> Apprenant'}</div>
</div>
</div>
</div>
</div>
</div>`;

loadComments(tutId);

const inputSection = document.getElementById("commentInputSection");
if (currentUser) {
const myAvHtml = myData.photoBase64 ? "<img src=\""+myData.photoBase64+"\"/>": (currentUser.displayName || currentUser.email).substring(0, 2).toUpperCase();
inputSection.innerHTML = `
<div class="comment-input-row">
<div class="comment-input-av">${myAvHtml}</div>
<div class="comment-input-box">
<textarea class="comment-textarea" id="commentTextarea" placeholder="Partage ton avis ou pose une question..."></textarea>
<button class="btn-comment" id="commentBtn" onclick="submitComment('${tutId}')">Commenter <i class="fa-solid fa-arrow-right"></i></button>
</div>
</div>`;
} else {
inputSection.innerHTML = `<div class="login-notice"><a href="login.html">Connecte-toi</a> ou <a href="signup.html">crée un compte</a> pour commenter.</div>`;
}
};

function loadComments(tutId) {
const list = document.getElementById("commentList");
if (!list) return;
if (unsubComments) unsubComments();

const ref = collection(db, "posts", tutId, "comments");
unsubComments = onSnapshot(ref, snap => {
if (!document.getElementById("commentList")) return;

const docs = [...snap.docs].sort((a, b) => {
const ta = a.data().createdAt?.toDate ? a.data().createdAt.toDate().getTime(): 0;
const tb = b.data().createdAt?.toDate ? b.data().createdAt.toDate().getTime(): 0;
return ta - tb;
});

if (docs.length === 0) {
list.innerHTML = "<div style=\"text-align:center;padding:20px;color:var(--gray);font-size:0.85rem;\">Aucun commentaire. Sois le premier !</div>";
return;
}

list.innerHTML = docs.map(d => {
const c = d.data();
const date = c.createdAt?.toDate ? timeAgo(c.createdAt.toDate()): "récemment";
const avHtml = c.photoBase64 ? "<img src=\""+c.photoBase64+"\"/>": (c.username || "?").substring(0, 2).toUpperCase();
return `<div class="comment-item">
<div class="comment-av">${avHtml}</div>
<div class="comment-bubble">
<div class="comment-header">
<a class="comment-author" href="user-profile.html?uid=${c.userId}">@${escapeHtml(c.username || "anonyme")}</a>
<span class="comment-role">${c.role === "mentor"?'<i class="fa-solid fa-star"></i> Mentor': '<i class="fa-solid fa-graduation-cap"></i> Apprenant'}</span>
<span class="comment-time">${date}</span>
</div>
<div class="comment-text">${escapeHtml(c.text)}</div>
</div>
</div>`;
}).join("");
});
}


window.submitComment = async function(tutId) {
if (!currentUser) {
window.location.href = "login.html"; return;
}
const textarea = document.getElementById("commentTextarea");
const text = textarea?.value.trim();
if (!text) {
showToast("Écris un commentaire d\'abord !"); return;
}
const btn = document.getElementById("commentBtn");
btn.disabled = true; btn.textContent = "Publication...";
try {
await addDoc(collection(db, "posts", tutId, "comments"), {
text,
username: myData.username || currentUser.email.split("@")[0],
userId: currentUser.uid,
photoBase64: myData.photoBase64 || null,
role: myData.role || "apprenant",
createdAt: serverTimestamp()
});
await setDoc(doc(db, "posts", tutId), {
comments: increment(1)
}, {
merge: true
});
try {
await setDoc(doc(db, "users", currentUser.uid), {
points: increment(2)
}, {
merge: true
});
} catch(e) {}
textarea.value = "";
btn.disabled = false; btn.innerHTML = 'Commenter <i class="fa-solid fa-arrow-right"></i>';
} catch(e) {
btn.disabled = false; btn.innerHTML = 'Commenter <i class="fa-solid fa-arrow-right"></i>';
showToast("Erreur: "+e.message, "error");
}
};


window.likeTutorial = async function(tutId) {
if (!currentUser) {
window.location.href = "login.html"; return;
}
const btn = document.getElementById("likeBtn");
const countEl = document.getElementById("likeCount");
if (!btn || btn.classList.contains("liked")) return;
try {
const ref = doc(db, "posts", tutId);
const snap = await getDoc(ref);
if (!snap.exists()) return;
if ((snap.data().votedBy || []).includes(currentUser.uid)) return;
await updateDoc(ref, {
votes: increment(1), votedBy: arrayUnion(currentUser.uid)
});
btn.classList.add("liked");
if (countEl) countEl.textContent = parseInt(countEl.textContent || "0") + 1;

if (snap.data().userId !== currentUser.uid) {
await setDoc(doc(db, "users", snap.data().userId), {
points: increment(10)
}, {
merge: true
});
}
} catch(e) {}
};


window.backToList = function() {
activeTutId = null;
if (unsubComments) unsubComments();
document.getElementById("listView").classList.remove("hidden");
document.getElementById("detailView").classList.remove("active");
document.getElementById("detailContent").innerHTML = "";
document.getElementById("commentList").innerHTML = "";
};

window.setLevel = function(level, el) {
currentLevel = level;
document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
el.classList.add("active");
renderTutorials();
};

window.filterTutorials = function() {
renderTutorials();
};


window.openWriteModal = function() {
if (!currentUser) {
window.location.href = "login.html"; return;
} document.getElementById("writeModal").classList.add("open");
};
window.closeWriteModal = function() {
document.getElementById("writeModal").classList.remove("open");
};

window.publishTutorial = async function() {
if (!currentUser) {
window.location.href = "login.html"; return;
}
const title = document.getElementById("tutTitle").value.trim();
const content = document.getElementById("tutContent").value.trim();
const level = document.getElementById("tutLevel").value;
const tags = [...document.querySelectorAll(".modal-tag.selected")].map(t => t.textContent);
const btn = document.getElementById("publishBtn");

if (!title) {
showToast("Ajoute un titre à ton tutoriel."); return;
}
if (!content || content.length < 50) {
showToast("Le contenu doit faire au moins 50 caractères."); return;
}

btn.disabled = true; btn.textContent = "Publication...";
try {
await addDoc(collection(db, "posts"), {
title, content, level, tags,
type: "tutorial",
username: myData.username || currentUser.email.split("@")[0],
userId: currentUser.uid,
authorPhoto: myData.photoBase64 || null,
authorRole: myData.role || "apprenant",
votes: 0,
comments: 0,
votedBy: [],
createdAt: serverTimestamp()
});

await setDoc(doc(db, "users", currentUser.uid), {
points: increment(30), tutorials: increment(1)
}, {
merge: true
});


document.getElementById("tutTitle").value = "";
document.getElementById("tutContent").value = "";
document.querySelectorAll(".modal-tag.selected").forEach(t => t.classList.remove("selected"));
btn.disabled = false; btn.innerHTML = 'Publier le tutoriel <i class="fa-solid fa-arrow-right"></i>';
closeWriteModal();
showToast("Tutoriel publie avec succes ! +30 points", "success");
} catch(e) {
btn.disabled = false; btn.innerHTML = 'Publier le tutoriel <i class="fa-solid fa-arrow-right"></i>';
showToast("Erreur: "+e.message, "error");
}
};

function escapeHtml(text) {
return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function timeAgo(date) {
const d = Math.floor((Date.now()-date)/1000);
if (d < 60) return "à l instant";
if (d < 3600) return "Il y a "+Math.floor(d/60)+"min";
if (d < 86400) return "Il y a "+Math.floor(d/3600)+"h";
return "Il y a "+Math.floor(d/86400)+" jour(s)";
}
</script>

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js')
    .then(reg => console.log('Service Worker enregistré:', reg.scope))
    .catch(err => console.log('Erreur Service Worker:', err));
}
</script>
