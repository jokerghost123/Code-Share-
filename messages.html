<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "598bd958-5b76-41b9-8d72-a84ffe1cf92b",
      serviceWorkerParam: { scope: "/" },
      serviceWorkerPath: "sw.js"
    });
  });
</script>

<script>
(function() {
try {
if (localStorage.getItem('theme') === 'light')document.documentElement.setAttribute('data-theme', 'light');
}catch(e) {}})();
</script>
<title>Code-Share — Messages</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<style>
:root {
--gold: #F5A800;
--blue: #1A6FE8;
--black: #0A0A0A;
--card: #16191F;
--white: #FFFFFF;
--gray: #8892A4;
--green: #28C840;
--text-soft: rgba(255,255,255,0.75);
}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
html, body {
height: 100%;
overflow: hidden;
}
body {
background: var(--black);
color:var(--white);
font-family:sans-serif;
display: flex;
flex-direction: column;
}
body::before {
content: "";
position: fixed;
inset: 0;
background-size: 60px 60px;
pointer-events: none;
z-index: 0;
}

nav {
position: relative;
z-index: 100;
display: flex;
align-items: center;
justify-content: space-between;
padding: 12px 20px;
background: rgba(10,10,10,0.98);
border-bottom: 1px solid rgba(245,168,0,0.15);
flex-shrink: 0;
}
.nav-logo {
display: flex;
align-items: center;
gap: 10px;
cursor: pointer;
}
.nav-logo img {
width: 40px;
height: 40px;
object-fit: contain;
border-radius: 50%;
}
.logo-text {
font-family: "Orbitron",monospace;
font-size: 1rem;
font-weight: 700;
color: var(--white);
}
.logo-text .b {
color: var(--blue);
}

.logo-text .g {
color: var(--gold);
}
.nav-links {
display: flex;
gap: 20px;
}
.nav-links a {
color: var(--gray);
text-decoration: none;
font-size: 0.8rem;
font-weight: 600;
cursor: none;
transition: color 0.2s;
}
.nav-links a:hover, .nav-links a.active {
color: var(--gold);
}
.nav-right {
display: flex;
align-items: center;
gap: 10px;
}
.nav-avatar {
width: 36px;
height: 36px;
border-radius: 50%;
background:var(--blue);
display: flex;
align-items: center;
justify-content: center;
font-weight: 700;
font-size: 0.78rem;
cursor: none;
border: 1px solid rgba(245,168,0,0.4);
overflow: hidden;
flex-shrink: 0;
}
.nav-avatar img {
width: 100%;
height: 100%;
object-fit: cover;
border-radius: 50%;
}

.chat-layout {
display: flex;
flex: 1;
overflow: hidden;
position: relative;
z-index: 1;
height: calc(100vh - 57px);
}

.conv-panel {
width: 300px;
flex-shrink: 0;
display: flex;
flex-direction: column;
border-right: 1px solid rgba(255,255,255,0.07);
background: rgba(10,10,10,0.5);
}
.conv-header {
padding: 14px 16px;
border-bottom: 1px solid rgba(255,255,255,0.06);
}
.conv-header-top {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 10px;
}
.conv-title {
font-family: "Orbitron",monospace;
font-size: 1.3rem;
font-weight: 700;
color: var(--gold);
}
.btn-new-conv {
background: var(--blue);
color:#E2E5E7;
border: none;
border-radius: 6px;
padding: 6px 12px;
font-size: 1rem;
font-weight: 700;
cursor: none;
font-family: sans-serif;
transition: all 0.2s;
}
.btn-new-conv:hover {
background: #e09500;
}
.conv-search {
position: relative;
}
.conv-search-icon {
position: absolute;
left: 10px;
top: 50%;
transform: translateY(-50%);
font-size: 0.85rem;
}
.conv-search input {
width: 100%;
background: rgba(255,255,255,0.05);
border: 1.5px solid rgba(255,255,255,0.08);
border-radius: 8px;
padding: 8px 10px 8px 32px;
color: var(--white);
font-family: sans-serif;
font-size: 0.82rem;
outline: none;
transition: border-color 0.2s;
}
.conv-search input:focus {
border-color: var(--gold);
}
.conv-search input::placeholder {
color: rgba(255,255,255,0.2);
}
.conv-list {
flex: 1;
overflow-y: auto;
}
.conv-list::-webkit-scrollbar {
width: 4px;
}
.conv-list::-webkit-scrollbar-thumb {
background: rgba(255,255,255,0.1);
border-radius: 2px;
}
.conv-item {
display: flex;
align-items: center;
gap: 10px;
padding: 12px 16px;
cursor: pointer;
transition: background 0.2s;
border-bottom: 1px solid rgba(255,255,255,0.04);
position: relative;
}
.conv-options-btn {
background: none;
border: none;
color: var(--gray);
font-size: 0.95rem;
padding: 8px;
flex-shrink: 0;
cursor:none;
border-radius: 8px;
}
.conv-options-btn:hover {
color: var(--gold);
background: rgba(255,255,255,0.06);
}
.block-banner {
display: flex;
align-items: center;
gap: 8px;
justify-content: center;
flex-wrap: wrap;
background: rgba(229,72,77,0.1);
border-top: 1px solid rgba(229,72,77,0.25);
color: #e5484d;
font-size: 0.78rem;
padding: 12px 16px;
text-align: center;
}
.block-banner .unblock-link {
color: var(--gold);
text-decoration: underline;
cursor: pointer;
font-weight: 700;
}
.msg-delete-btn {
background: none;
border: none;
color: var(--gray);
font-size: 0.75rem;
padding: 4px 6px;
cursor:none;
opacity: 0.6;
transition: opacity 0.15s,color 0.15s;
}
.msg-delete-btn:hover {
opacity: 1;
color: #e5484d;
}
.msg-item {
position: relative;
}
.msg-item .msg-content {
position: relative;
}
.conv-item:hover {
background: rgba(255,255,255,0.04);
}
.conv-item.active {
background: rgba(245,168,0,0.08);
border-left: 3px solid var(--gold);
}
.conv-item.active:hover {
background: rgba(245,168,0,0.1);
}
.conv-avatar-wrap {
position: relative;
flex-shrink: 0;
}
.conv-avatar {
width: 42px;
height: 42px;
border-radius: 50%;
background:var(--blue);
display: flex;
align-items: center;
justify-content: center;
font-weight: 700;
font-size: 0.88rem;
overflow: hidden;
}
.conv-avatar img {
width: 100%;
height: 100%;
object-fit: cover;
border-radius: 50%;
}
.status-dot {
position: absolute;
bottom: 1px;
right: 1px;
width: 11px;
height: 11px;
border-radius: 50%;
border: 2px solid var(--black);
}
.status-dot.online {
background: var(--green);
}
.status-dot.offline {
background: var(--gray);
}
.conv-info {
flex: 1;
min-width: 0;
}
.conv-name {
font-size: 0.86rem;
font-weight: 600;
margin-bottom: 2px;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.conv-preview {
font-size: 0.74rem;
color: var(--gray);
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.conv-preview.unread {
color: var(--white);
font-weight: 600;
}
.conv-meta {
display: flex;
flex-direction: column;
align-items: flex-end;
gap: 4px;
flex-shrink: 0;
}
.conv-time {
font-size: 0.66rem;
color: var(--gray);
}
.unread-badge {
background: var(--gold);
color: var(--black);
font-size: 0.62rem;
font-weight: 700;
min-width: 18px;
height: 18px;
border-radius: 9px;
display: flex;
align-items: center;
justify-content: center;
padding: 0 4px;
}
.conv-empty {
text-align: center;
padding: 40px 16px;
color: var(--gray);
font-size: 0.82rem;
line-height: 1.6;
}


.chat-panel {
flex: 1;
display: flex;
flex-direction: column;
overflow: hidden;
}


.chat-placeholder {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
color: var(--gray);
text-align: center;
padding: 20px;
}
.chat-placeholder img {
width: 64px;
height: 64px;
object-fit: contain;
opacity: 0.25;
margin-bottom: 16px;
}
.chat-placeholder h3 {
font-family: "Orbitron",monospace;
font-size: 0.9rem;
color: var(--white);
opacity: 0.4;
margin-bottom: 8px;
}
.chat-placeholder p {
font-size: 0.82rem;
line-height: 1.6;
}


.chat-head {
display: flex;
align-items: center;
gap: 12px;
padding: 12px 18px;
border-bottom: 1px solid rgba(255,255,255,0.07);
background: rgba(10,10,10,0.6);
flex-shrink: 0;
}
.back-mobile {
display: none;
background: transparent;
border: none;
color: var(--gray);
font-size: 1.1rem;
cursor: pointer;
padding: 4px;
}
.chat-head-avatar-wrap {
position: relative;
}
.chat-head-avatar {
width: 38px;
height: 38px;
border-radius: 50%;
background:var(--blue);
display: flex;
align-items: center;
justify-content: center;
font-weight: 700;
font-size: 0.85rem;
overflow: hidden;
flex-shrink: 0;
}
.chat-head-avatar img {
width: 100%;
height: 100%;
object-fit: cover;
border-radius: 50%;
}
.chat-head-status-dot {
position: absolute;
bottom: 1px;
right: 1px;
width: 10px;
height: 10px;
border-radius: 50%;
border: 2px solid var(--black);
}
.chat-head-status-dot.online {
background: var(--green);
}
.chat-head-status-dot.offline {
background: var(--gray);
}
.chat-head-info {
flex: 1;
}
.chat-head-name {
font-weight: 700;
font-size: 0.92rem;
margin-bottom: 2px;
cursor: pointer;
}
.chat-head-name:hover {
color: var(--gold);
}
.chat-head-status {
font-size: 0.72rem;
}
.chat-head-status.online {
color: var(--green);
}
.chat-head-status.offline {
color: var(--gray);
}

.messages-wrap {
flex: 1;
overflow-y: auto;
padding: 16px;
display: flex;
flex-direction: column;
gap: 12px;
}
.messages-wrap::-webkit-scrollbar {
width: 4px;
}
.messages-wrap::-webkit-scrollbar-thumb {
background: rgba(255,255,255,0.08);
border-radius: 2px;
}


.date-sep {
text-align: center;
position: relative;
margin: 8px 0;
}
.date-sep::before {
content: "";
position: absolute;
left: 0;
right: 0;
top: 50%;
height: 1px;
background: rgba(255,255,255,0.06);
}
.date-sep span {
background: var(--black);
padding: 0 12px;
font-size: 0.7rem;
color: var(--gray);
position: relative;
}

.msg-group {
display: flex;
flex-direction: column;
gap: 3px;
}
.msg-item {
display: flex;
gap: 8px;
align-items: flex-end;
max-width: 75%;
}
.msg-item.sent {
margin-left: auto;
flex-direction: row-reverse;
}
.msg-avatar {
width: 28px;
height: 28px;
border-radius: 50%;
background:var(--blue);
display: flex;
align-items: center;
justify-content: center;
font-size: 0.65rem;
font-weight: 700;
flex-shrink: 0;
overflow: hidden;
}
.msg-avatar img {
width: 100%;
height: 100%;
object-fit: cover;
border-radius: 50%;
}
.msg-avatar.hidden {
visibility: hidden;
}
.msg-content {
display: flex;
flex-direction: column;
gap: 2px;
}
.msg-bubble {
padding: 10px 14px;
border-radius: 16px;
font-size: 0.86rem;
line-height: 1.5;
word-break: break-word;
max-width: 100%;
}
.msg-item.received .msg-bubble {
background: var(--card);
border: 1px solid rgba(255,255,255,0.07);
border-bottom-left-radius: 4px;
color: var(--white);
}
.msg-item.sent .msg-bubble {
background: linear-gradient(135deg,var(--blue),#1058c7);
border-bottom-right-radius: 4px;
color: var(--white);
}

.status-reply-quote {
display: flex;
align-items: center;
gap: 8px;
background: rgba(0,0,0,0.18);
border-left: 3px solid var(--gold);
border-radius: 8px;
padding: 6px 8px;
margin-bottom: 6px;
cursor: pointer;
}
.status-reply-thumb {
width: 32px;
height: 32px;
border-radius: 6px;
object-fit: cover;
flex-shrink: 0;
}
.status-reply-icon {
width: 32px;
height: 32px;
border-radius: 6px;
background: rgba(245,168,0,0.15);
color: var(--gold);
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
font-size: 0.9rem;
}
.status-reply-text {
display: flex;
flex-direction: column;
gap: 2px;
min-width: 0;
}
.status-reply-label {
font-size: 0.68rem;
font-weight: 700;
color: var(--gold);
text-transform: uppercase;
letter-spacing: 0.3px;
}
.status-reply-preview {
font-size: 0.78rem;
color: var(--text-soft);
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
max-width: 200px;
}
.msg-time {
font-size: 0.64rem;
color: var(--gray);
}
.msg-item.sent .msg-time {
text-align: right;
}
.msg-status {
font-size: 0.64rem;
color: rgba(136,146,164,0.6);
text-align: right;
}
.msg-status.read {
color: var(--blue);
}

.typing-indicator {
display: none;
align-items: center;
gap: 8px;
padding: 8px 0;
}
.typing-indicator.show {
display: flex;
}
.typing-dots {
display: flex;
gap: 4px;
}
.typing-dot {
width: 6px;
height: 6px;
background: var(--gray);
border-radius: 50%;
animation: bounce 1.2s infinite;
}
.typing-dot:nth-child(2) {
animation-delay: 0.2s;
}
.typing-dot:nth-child(3) {
animation-delay: 0.4s;
}
@keyframes bounce {
0%,80%,100% {
transform: scale(1);
opacity: 0.5
}

40% {
transform: scale(1.3);
opacity: 1
}
}
.typing-text {
font-size: 0.75rem;
color: var(--gray);
font-style: italic;
}

.msg-input-area {
padding: 12px 16px;
border-top: 1px solid rgba(255,255,255,0.07);
background: rgba(10,10,10,0.6);
flex-shrink: 0;
}
.msg-input-row {
display: flex;
gap: 10px;
align-items: flex-end;
}
.msg-input {
flex: 1;
background: rgba(255,255,255,0.05);
border: 1.5px solid rgba(255,255,255,0.1);
border-radius: 20px;
padding: 10px 16px;
color: var(--white);
font-family:sans-serif;
font-size: 0.88rem;
outline: none;
resize: none;
max-height: 120px;
min-height: 42px;
line-height: 1.4;
transition: border-color 0.2s;
}
.msg-input:focus {
border-color: var(--blue);
}
.msg-input::placeholder {
color: rgba(255,255,255,0.2);
}
.btn-send {
width: 42px;
height: 42px;
background: var(--blue);
border: none;
border-radius: 50%;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
font-size: 1rem;
transition: all 0.2s;
flex-shrink: 0;
}
.btn-send:hover {
background: #2a7fff;
transform: scale(1.05);
}
.btn-send:disabled {
opacity: 0.4;
cursor: not-allowed;
transform: none;
}
.input-hint {
font-size: 0.7rem;
color: rgba(136,146,164,0.4);
margin-top: 5px;
text-align: right;
}


.modal-overlay {
display: none;
position: fixed;
inset: 0;
background: rgba(0,0,0,0.78);
z-index: 200;
align-items: center;
justify-content: center;
padding: 16px;
}
.modal-overlay.open {
display: flex;
}
.modal {
background: #1a1f2a;
border: 1px solid rgba(245,168,0,0.2);
border-radius: 14px;
padding: 24px;
width: 100%;
max-width: 460px;
max-height: 80vh;
display: flex;
flex-direction: column;
}
.modal-title {
font-family: "Orbitron",monospace;
font-size: 0.95rem;
font-weight: 700;
color: var(--gold);
margin-bottom: 16px;
display: flex;
justify-content: space-between;
align-items: center;
}
.modal-close {
background: transparent;
border: none;
color: var(--gray);
font-size: 1.2rem;
cursor: pointer;
}
.modal-search {
position: relative;
margin-bottom: 12px;
}
.modal-search-icon {
position: absolute;
left: 12px;
top: 50%;
transform: translateY(-50%);
}
.modal-search input {
width: 100%;
background: rgba(255,255,255,0.05);
border: 1.5px solid rgba(255,255,255,0.1);
border-radius: 8px;
padding: 10px 12px 10px 36px;
color: var(--white);
font-family: sans-serif;
font-size: 0.88rem;
outline: none;
}
.modal-search input:focus {
border-color: var(--gold);
}
.modal-search input::placeholder {
color: rgba(255,255,255,0.2);
}
.user-results {
flex: 1;
overflow-y: auto;
display: flex;
flex-direction: column;
gap: 8px;
}
.user-result {
display: flex;
align-items: center;
gap: 10px;
padding: 10px 12px;
background: rgba(255,255,255,0.03);
border: 1px solid rgba(255,255,255,0.07);
border-radius: 8px;
cursor: pointer;
transition: all 0.2s;
}
.user-result:hover {
border-color: rgba(245,168,0,0.3);
background: rgba(245,168,0,0.05);
}
.user-result-avatar {
width: 38px;
height: 38px;
border-radius: 50%;
background:var(--blue);
display: flex;
align-items: center;
justify-content: center;
font-weight: 700;
font-size: 0.85rem;
overflow: hidden;
flex-shrink: 0;
position: relative;
}
.user-result-avatar img {
width: 100%;
height: 100%;
object-fit: cover;
border-radius: 50%;
}
.user-result-status {
position: absolute;
bottom: 1px;
right: 1px;
width: 10px;
height: 10px;
border-radius: 50%;
border: 2px solid #1a1f2a;
}
.user-result-status.online {
background: var(--green);
}
.user-result-status.offline {
background: var(--gray);
}
.user-result-info {
flex: 1;
}
.user-result-name {
font-size: 0.88rem;
font-weight: 600;
}
.user-result-sub {
font-size: 0.72rem;
color: var(--gray);
}
.user-result-online {
font-size: 0.7rem;
}
.user-result-online.online {
color: var(--green);
}
.user-result-online.offline {
color: var(--gray);
}
.modal-empty {
text-align: center;
padding: 24px;
color: var(--gray);
font-size: 0.82rem;
}


@media(max-width:640px) {
.conv-panel {
position: absolute;
left: 0;
top: 0;
bottom: 0;
z-index: 10;
background: var(--black);
transform: translateX(0);
transition: transform 0.3s;
width: 100%;
}
.conv-panel.hidden-mobile {
transform: translateX(-100%);
}
.chat-panel {
width: 100%;
}
.back-mobile {
display: block;
}
.nav-links {
display: none;
}
}


.bottom-bar {
position: fixed;
bottom: 0;
left: 0;
width: 100%;
height: 72px;
background: rgba(10,10,10,0.9);
border-top: 1px solid rgba(245,168,0,.15);
display: flex;
justify-content: space-around;
align-items: center;
z-index: 999;
}

.bottom-item {
flex: 1;
text-decoration: none;
color: var(--gray);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 5px;
font-size: .75rem;
transition: .3s;

}

.bottom-item i {
font-size: 1.2rem;
}

.bottom-item:hover,
.bottom-item.active {
color: var(--gold);
border-radius: 50px;
overflow: hidden;
}

@media(min-width:769px) {
.bottom-bar {
display: none;
}
}

.msg-input-row { align-items: flex-end; }
.btn-attach, .btn-mic {
  background: transparent; border: none; color: var(--gray);
  font-size: 1.2rem; cursor: pointer; padding: 8px; flex-shrink: 0;
}
.btn-mic.recording { color: #e33; animation: pulse-mic 1s infinite; }
@keyframes pulse-mic { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
.recording-bar {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  background: rgba(227,51,51,0.1); border-radius: 10px; margin-bottom: 6px;
}
.recording-bar .rec-time { font-weight: 700; color: #e33; font-size: 0.85rem; }
.recording-bar .rec-cancel { margin-left: auto; color: var(--gray); cursor: pointer; }
.chat-img-preview-wrap { position: relative; display: inline-block; margin-bottom: 6px; }
.chat-img-preview-wrap img { max-height: 90px; border-radius: 8px; }
.chat-img-preview-wrap .remove-preview {
  position: absolute; top: -6px; right: -6px; background: #e33; color: #fff;
  border-radius: 50%; width: 20px; height: 20px; font-size: 0.7rem;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.msg-bubble img.chat-msg-img { max-width: 220px; border-radius: 10px; cursor: zoom-in; display: block; }
.msg-bubble audio { max-width: 220px; }
.chat-img-fullscreen {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.92); z-index: 9999; align-items: center; justify-content: center;
}
.chat-img-fullscreen.open { display: flex; }
.chat-img-fullscreen img { max-width: 92%; max-height: 92%; border-radius: 8px; }
.chat-img-fullscreen .close-x { position: absolute; top: 16px; right: 20px; color: #fff; font-size: 2rem; cursor: none; }

async function setOnline(uid) {

{
merge: true
});

});

function watchPresence(uid, callback) {
return onSnapshot(doc(db, "presence", uid),
snap => {
if (snap.exists()) {
const data = snap.data();
const online = data.online === true;
const lastSeen = data.lastSeen?.toDate ? data.lastSeen.toDate(): null;
const isOnline = online && lastSeen && (Date.now() - lastSeen.getTime()) < 3 * 60 * 1000;
callback(isOnline, lastSeen);
} else {
callback(false, null);
}
});
}


window.handleChatImageSelect = function(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
        showToast("Image trop grande. Maximum 5MB.", "error");
        return;
    }
    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement("canvas");
            const MAX = 800;
            let w = img.width, h = img.height;
            if (w > MAX || h > MAX) {
                if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
                else { w = Math.round(w * MAX / h); h = MAX; }
            }
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            chatSelectedImg = canvas.toDataURL("image/jpeg", 0.7);
            document.getElementById("chatImgPreviewZone").innerHTML = `
                <div class="chat-img-preview-wrap">
                    <img src="${chatSelectedImg}">
                    <div class="remove-preview" onclick="removeChatImgPreview()">✕</div>
                </div>`;
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
};

window.toggleVoiceRecording = async function(convId, otherId) {
    if (isRecording) {
        mediaRecorder.stop();
        return;
    }
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mimeType = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm"
            : MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "";
        mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        audioChunks = [];
        isRecording = true;
        recordSeconds = 0;

        document.getElementById("micBtn").classList.add("recording");
        document.getElementById("recordingBarZone").innerHTML = `
            <div class="recording-bar">
                <i class="fa-solid fa-microphone" style="color:#e33;"></i>
                <span class="rec-time" id="recTimeLabel">0:00</span>
                <span class="rec-cancel" onclick="cancelVoiceRecording()">Annuler</span>
            </div>`;
        recordTimer = setInterval(() => {
            recordSeconds++;
            const m = Math.floor(recordSeconds / 60), s = recordSeconds % 60;
            const label = document.getElementById("recTimeLabel");
            if (label) label.textContent = `${m}:${s.toString().padStart(2, "0")}`;
            if (recordSeconds >= MAX_RECORD_SECONDS) mediaRecorder.stop();
        }, 1000);

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
            clearInterval(recordTimer);
            stream.getTracks().forEach(t => t.stop());
            isRecording = false;
            document.getElementById("micBtn").classList.remove("recording");
            document.getElementById("recordingBarZone").innerHTML = "";

            if (recordSeconds < 1) return; 
            const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
            const reader = new FileReader();
            reader.onload = async () => {
                const base64Audio = reader.result;
                if (base64Audio.length > 900000) {
                    showToast("Message vocal trop long, réessaie en plus court.", "error");
                    return;
                }
                await sendChatContent(convId, otherId, { type: "audio", audioBase64: base64Audio, audioDuration: recordSeconds }, "🎤 Message vocal");
            };
            reader.readAsDataURL(blob);
        };

        mediaRecorder.start();
    } catch (e) {
        showToast("Impossible d'accéder au micro : " + e.message, "error");
    }
};

window.cancelVoiceRecording = function() {
    recordSeconds = 0;
    if (mediaRecorder && isRecording) mediaRecorder.stop();
};


async function sendChatContent(convId, otherId, contentFields, previewLabel) {
    try {
        const convCheck = await getDoc(doc(db, "conversations", convId));
        if ((convCheck.data()?.blockedBy || []).length > 0) {
            showToast("Impossible d'envoyer : la conversation est bloquée.", "error");
            return;
        }

        await addDoc(collection(db, "conversations", convId, "messages"), {
            ...contentFields,
            senderId: me.uid,
            senderName: myData.username || me.email.split("@")[0],
            createdAt: serverTimestamp()
        });

        await setDoc(doc(db, "conversations", convId), {
            lastMessage: previewLabel,
            lastMessageAt: serverTimestamp(),
            unreadBy: [otherId],
            deletedFor: arrayRemove(me.uid, otherId)
        }, { merge: true });

        try {
            await addDoc(collection(db, "users", otherId, "notifications"), {
                type: "message",
                senderName: myData.username || me.email.split("@")[0],
                senderPhoto: myData.photoBase64 || null,
                message: "t a envoyé un message",
                link: "messages.html?conv=" + convId,
                read: false,
                createdAt: new Date()
            });
        } catch (e) {}

        sendOneSignalNotification(otherId, myData.username || me.email.split("@")[0], previewLabel, "messages.html?conv=" + convId);
    } catch (e) {
        showToast("Erreur: " + e.message, "error");
    }
}

function loadConversations() {
const q = query(collection(db, "conversations"),
where("members", "array-contains", me.uid));
unsubConvs = onSnapshot(q,
async snap => {
allConvs = [];
const convList = document.getElementById("convList");

if (snap.empty) {
convList.innerHTML = "<div class=\"conv-empty\">Aucune conversation.<br/>Clique sur <strong>+ Nouveau</strong> pour commencer !</div>";
return;
}

const convData = [];
for (const d of snap.docs) {
try {
const conv = d.data();
if (!conv.members || !Array.isArray(conv.members)) continue;
if ((conv.deletedFor || []).includes(me.uid)) continue;
const otherId = conv.members.find(m => m !== me.uid);
if (!otherId) continue;
let otherUser = {
username: "Membre",
photoBase64: null,
role: "apprenant"
};
try {
const ou = await getDoc(doc(db, "users", otherId));
if (ou.exists()) otherUser = ou.data();
} catch(e) {}
convData.push({
id: d.id, conv, otherId, otherUser
});
} catch(e) {
console.error("Conv error:", e);
}
}
convData.sort((a, b) => {
const ta = a.conv.lastMessageAt?.toDate ? a.conv.lastMessageAt.toDate().getTime(): 0;
const tb = b.conv.lastMessageAt?.toDate ? b.conv.lastMessageAt.toDate().getTime(): 0;
return tb - ta;
});
allConvs = convData;
renderConvList(convData);
});
}

window.openMessageOptions = async function(convId, msgId, isSent) {
const actions = [{
key: "forMe", label: "Supprimer pour moi", icon: "fa-solid fa-trash", danger: true
}];
if (isSent) {
actions.push({
key: "forEveryone", label: "Supprimer pour tout le monde", icon: "fa-solid fa-trash-can", danger: true
});
}
const choice = await showActionSheet(null, actions);
if (!choice) return;

if (choice === "forMe") {
try {
await updateDoc(doc(db, "conversations", convId, "messages", msgId), {
deletedFor: arrayUnion(me.uid)
});
showToast("Message supprimé pour vous.", "success");
} catch (e) {
showToast("Erreur : " + e.message, "error");
}
}

if (choice === "forEveryone") {
const ok = await showConfirm("Ce message sera supprimé pour tout le monde, sans possibilité de le récupérer.", {
title: "Supprimer pour tout le monde ?", danger: true, confirmLabel: "Supprimer"
});
if (!ok) return;
try {
await deleteDoc(doc(db, "conversations", convId, "messages", msgId));
showToast("Message supprimé.", "success");
} catch (e) {
showToast("Erreur : " + e.message, "error");
}
}
};

window.openConvOptions = async function(convId, otherId, name) {
let isBlocked = false;
try {
const snap = await getDoc(doc(db, "conversations", convId));
isBlocked = (snap.data()?.blockedBy || []).includes(me.uid);
} catch (e) {}

const choice = await showActionSheet(name, [{
key: "delete", label: "Supprimer la discussion", icon: "fa-solid fa-trash", danger: true
},
isBlocked
? {
key: "unblock", label: "Débloquer cet utilisateur", icon: "fa-solid fa-circle-check"
}: {
key: "block", label: "Bloquer cet utilisateur", icon: "fa-solid fa-ban", danger: true
},
{
key: "profile", label: "Voir le profil", icon: "fa-solid fa-user"
}]);

if (choice === "delete") {
const ok = await showConfirm("Cette discussion disparaîtra de votre liste. Elle réapparaîtra si l'autre personne vous écrit à nouveau.", {
title: "Supprimer cette discussion ?", danger: true, confirmLabel: "Supprimer"
});
if (!ok) return;
try {
await updateDoc(doc(db, "conversations", convId), {
deletedFor: arrayUnion(me.uid)
});
if (activeConvId === convId) {
document.getElementById("chatPanel").innerHTML = "";
activeConvId = null;
}
showToast("Discussion supprimée.", "success");
} catch (e) {
showToast("Erreur : " + e.message, "error");
}
}

if (choice === "block") {
const ok = await showConfirm(`${name} ne pourra plus vous envoyer de message, et vous ne pourrez plus lui en envoyer non plus.`, {
title: "Bloquer cet utilisateur ?", danger: true, confirmLabel: "Bloquer"
});
if (!ok) return;
try {
await updateDoc(doc(db, "conversations", convId), {
blockedBy: arrayUnion(me.uid)
});
showToast(`@${name} a été bloqué.`, "success");
if (activeConvId === convId) refreshBlockBanner(convId);
} catch (e) {
showToast("Erreur : " + e.message, "error");
}
}

if (choice === "unblock") {
try {
await updateDoc(doc(db, "conversations", convId), {
blockedBy: arrayRemove(me.uid)
});
showToast(`@${name} a été débloqué.`, "success");
if (activeConvId === convId) refreshBlockBanner(convId);
} catch (e) {
showToast("Erreur : " + e.message, "error");
}
}

if (choice === "profile") {
window.location.href = `user-profile.html?uid=${otherId}`;
}
};

async function refreshBlockBanner(convId) {
const inputArea = document.querySelector(".msg-input-area");
if (!inputArea) return;
try {
const snap = await getDoc(doc(db, "conversations", convId));
const blockedBy = snap.data()?.blockedBy || [];
const existingBanner = document.getElementById("blockBanner");
if (existingBanner) existingBanner.remove();

if (blockedBy.length > 0) {
const iBlocked = blockedBy.includes(me.uid);
const banner = document.createElement("div");
banner.id = "blockBanner";
banner.className = "block-banner";
banner.innerHTML = iBlocked
? `<i class="fa-solid fa-ban"></i> Vous avez bloqué cet utilisateur. <span class="unblock-link" onclick="unblockFromBanner('${convId}')">Débloquer</span>`: `<i class="fa-solid fa-ban"></i> Vous ne pouvez plus échanger de messages ici.`;
inputArea.parentElement.insertBefore(banner, inputArea);
inputArea.style.display = "none";
} else {
inputArea.style.display = "";
}
} catch (e) {}
}

window.unblockFromBanner = async function(convId) {
try {
await updateDoc(doc(db, "conversations", convId), {
blockedBy: arrayRemove(me.uid)
});
showToast("Utilisateur débloqué.", "success");
refreshBlockBanner(convId);
} catch (e) {
showToast("Erreur : " + e.message, "error");
}
};

function updateChatHeadStatus(otherId, isOnline, name, lastSeen) {
const dot = document.getElementById("head-dot");
const status = document.getElementById("head-status");
if (!dot || !status) return;
if (isOnline) {
dot.className = "chat-head-status-dot online";
status.className = "chat-head-status online";
status.textContent = "En ligne";
} else {
dot.className = "chat-head-status-dot offline";
status.className = "chat-head-status offline";
status.textContent = lastSeen ? "Vu " + timeAgo(lastSeen): "Hors ligne";
}
}

function watchTyping(convId, otherId) {
onSnapshot(doc(db, "conversations", convId), snap => {
if (!snap.exists()) return;
const data = snap.data();
const typing = data.typingUsers || {};
const isTyping = typing[otherId] === true;
const indicator = document.getElementById("typingIndicator");
if (indicator) indicator.className = "typing-indicator" + (isTyping ? " show": "");
});
}

window.handleTyping = async function(convId) {
if (!me || !convId) return;
clearTimeout(typingTimer);
try {
await updateDoc(doc(db, "conversations", convId), {
[`typingUsers.${me.uid}`]: true
});
typingTimer = setTimeout(async () => {
await updateDoc(doc(db, "conversations", convId), {
[`typingUsers.${me.uid}`]: false
}).catch(()=> {});
}, 2000);
} catch(e) {}
};

window.sendMessage = async function(convId, otherId) {
if (chatSelectedImg) {
    await sendImageMessage(convId, otherId);
    return;
}
const input = document.getElementById("msgInput");
if (!input) return;
const text = input.value.trim();
if (!text || !me) return;
const btn = document.getElementById("sendBtn");
if (btn) btn.disabled = true;

try {
const convCheck = await getDoc(doc(db, "conversations", convId));
if ((convCheck.data()?.blockedBy || []).length > 0) {
showToast("Impossible d'envoyer : la conversation est bloquée.", "error");
if (btn) btn.disabled = false;
return;
}

await updateDoc(doc(db, "conversations", convId), {
[`typingUsers.${me.uid}`]: false
}).catch(()=> {});

await addDoc(collection(db, "conversations", convId, "messages"), {
text,
senderId: me.uid,
senderName: myData.username || me.email.split("@")[0],
createdAt: serverTimestamp()
});

await setDoc(doc(db, "conversations", convId), {
lastMessage: text.length > 50 ? text.substring(0, 50)+"...": text,
lastMessageAt: serverTimestamp(),
unreadBy: [otherId],
deletedFor: arrayRemove(me.uid, otherId)
}, {
merge: true
});

try {
await addDoc(collection(db, "users", otherId, "notifications"), {
type: "message",
senderName: myData.username || me.email.split("@")[0],
senderPhoto: myData.photoBase64 || null,
message: "t a envoyé un message",
link: "messages.html?conv="+convId,
read: false,
createdAt: new Date()
});
} catch(e) {}


sendOneSignalNotification(
    otherId,
    myData.username || me.email.split("@")[0],
    text.length > 100 ? text.substring(0, 100) + "..." : text,
    "messages.html?conv=" + convId
);

input.value = "";
input.style.height = "42px";
if (btn) btn.disabled = false;
} catch(e) {
if (btn) btn.disabled = false;
showToast("Erreur: "+e.message, "error");
}
};

window.handleKey = function(e, convId, otherId) {
if (e.key === "Enter" && !e.shiftKey) {
e.preventDefault();
sendMessage(convId, otherId);
}
};

window.autoResize = function(el) {
el.style.height = "42px";
el.style.height = Math.min(el.scrollHeight, 120) + "px";
};

window.openNewConv = () => document.getElementById("newConvModal").classList.add("open");
window.closeNewConv = () => {
document.getElementById("newConvModal").classList.remove("open");
document.getElementById("memberSearchInput").value = "";
document.getElementById("userResults").innerHTML = "<div class=\"modal-empty\">Tape pour rechercher un membre...</div>";
};

window.searchMembers = async function() {
const search = document.getElementById("memberSearchInput").value.trim().toLowerCase();
const results = document.getElementById("userResults");
if (!search) {
results.innerHTML = "<div class=\"modal-empty\">Tape pour rechercher un membre...</div>";
return;
}
results.innerHTML = "<div class=\"modal-empty\">Recherche...</div>";
try {
const snap = await getDocs(collection(db, "users"));
const users = snap.docs
.map(d => ({
id: d.id, ...d.data()}))
.filter(u => u.id !== me.uid)
.filter(u =>
(u.username || "").toLowerCase().includes(search) ||
(u.firstName || "").toLowerCase().includes(search) ||
(u.lastName || "").toLowerCase().includes(search)
);

if (users.length === 0) {
results.innerHTML = "<div class=\"modal-empty\">Aucun membre trouvé.</div>";
return;
}

results.innerHTML = "";
for (const u of users) {
const name = u.firstName ? u.firstName+" "+u.lastName: u.username || "Membre";
const avHtml = u.photoBase64 ? "<img src=\""+u.photoBase64+"\"/>": name.substring(0, 2).toUpperCase();

let isOnline = false;
try {
const ps = await getDoc(doc(db, "presence", u.id));
if (ps.exists()) {
const pd = ps.data();
const ls = pd.lastSeen?.toDate ? pd.lastSeen.toDate(): null;
isOnline = pd.online && ls && (Date.now()-ls.getTime()) < 3*60*1000;
}
} catch(e) {}

const div = document.createElement("div");
div.className = "user-result";
div.innerHTML = `
<div class="user-result-avatar">
${avHtml}
<div class="user-result-status ${isOnline?"online": "offline"}"></div>
</div>
<div class="user-result-info">
<div class="user-result-name">@${u.username || name}</div>
<div class="user-result-sub">${u.role === "mentor"?'<i class="fa-solid fa-star"></i> Mentor': '<i class="fa-solid fa-graduation-cap"></i> Apprenant'} · <span class="user-result-online ${isOnline?"online": "offline"}">${isOnline?"● En ligne": "Hors ligne"}</span></div>
</div>`;
div.onclick = () => startConversation(u.id, name, u);
results.appendChild(div);
}
} catch(e) {
results.innerHTML = "<div class=\"modal-empty\">Erreur: "+e.message+"</div>";
}
};

window.startConversation = async function(otherId, otherName, otherUser) {
closeNewConv();
const q = query(collection(db, "conversations"), where("members", "array-contains", me.uid));
const snap = await getDocs(q);
let existingId = null;
snap.forEach(d => {
if (d.data().members.includes(otherId)) existingId = d.id;
});

if (!existingId) {
const ref = doc(collection(db, "conversations"));
await setDoc(ref, {
members: [me.uid, otherId],
createdAt: serverTimestamp(),
lastMessageAt: serverTimestamp(),
lastMessage: "",
unreadBy: [],
typingUsers: {}
});
existingId = ref.id;
}
openConversation(existingId, otherName, otherId, otherUser);
};

window.showConvPanel = function() {
document.getElementById("convPanel").classList.remove("hidden-mobile");
activeConvId = null;
};

function escapeHtml(text) {
return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br/>");
}

function formatTime(date) {
return date.toLocaleTimeString("fr-FR", {
hour: "2-digit", minute: "2-digit"
});
}

function formatDateLabel(date) {
const now = new Date();
const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
const diff = Math.floor((today-d)/86400000);
if (diff === 0) return "Aujourd hui";
if (diff === 1) return "Hier";
return date.toLocaleDateString("fr-FR", {
day: "numeric", month: "long"
});
}

function timeAgo(date) {
const d = Math.floor((Date.now()-date)/1000);
if (d < 60) return "à l instant";
if (d < 3600) return "Il y a "+Math.floor(d/60)+" min";
if (d < 86400) return "Il y a "+Math.floor(d/3600)+"h";
return "Il y a "+Math.floor(d/86400)+"j";
}
